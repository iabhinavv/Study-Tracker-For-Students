/* =============================== state ================================== */

function blankDB() {
  return {
    v: SCHEMA,
    onboarded: false,
    profile: { name: '', sessionMinutes: 45, dailyGoalMin: 120, weekStart: 1, theme: 'light' },
    courses: [],
    sessions: [],
    resources: [],
    notebooks: [],
    pomo: null,
    pomoCfg: { focus: 25, short: 5, long: 15, cycle: 4, autoLog: true, countAsSession: true, sound: true },
    lastCourseId: null
  };
}

var DB = blankDB();

function dbLoad() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return false;
    var got = JSON.parse(raw);
    DB = Object.assign(blankDB(), got);
    DB.profile = Object.assign(blankDB().profile, got.profile || {});
    DB.pomoCfg = Object.assign(blankDB().pomoCfg, got.pomoCfg || {});
    ['courses', 'sessions', 'resources', 'notebooks'].forEach(function (k) {
      if (!Array.isArray(DB[k])) DB[k] = [];
    });
    /* v1 → v2: the palette changed with the paper-and-ink restyle, so any
       course still carrying an old colour is re-inked in course order */
    if (!got.v || got.v < 2) {
      DB.courses.forEach(function (c, i) {
        if (PALETTE.indexOf(c.color) < 0) c.color = PALETTE[i % PALETTE.length];
      });
      DB.v = SCHEMA;
      dbSave(true);
    }
    return true;
  } catch (e) {
    console.warn('could not read saved data', e);
    return false;
  }
}

var saveTimer = null;
function dbSave(immediate) {
  clearTimeout(saveTimer);
  var write = function () {
    DB.savedAt = new Date().toISOString();
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(DB));
    } catch (e) {
      /* full or blocked: in folder mode the file is the real home, so this is
         only a lost cache — say so, but do not pretend nothing was saved */
      toast(STORE.mode === 'folder'
        ? 'Browser cache is full — the folder file is still being written.'
        : 'Could not save — browser storage is full or blocked.', 5000);
    }
    storeQueue();                     // writes data/study-tracker.json in folder mode
  };
  if (immediate) write(); else saveTimer = setTimeout(write, 180);
}

/* ============================== helpers ================================== */

function uid() { return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function num(v, d) { var n = parseFloat(v); return isFinite(n) ? n : (d || 0); }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function $(sel, root) { return (root || document).querySelector(sel); }
/* phone-sized viewport: charts thin out and shrink rather than becoming unreadable */
function isNarrow() { return window.matchMedia && window.matchMedia('(max-width: 620px)').matches; }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

/* dates — always local, never UTC (a UTC round-trip shifts the day) */
function iso(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function fromISO(s) { var p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
function today() { return iso(new Date()); }
function shiftDays(isoStr, n) { var d = fromISO(isoStr); d.setDate(d.getDate() + n); return iso(d); }
function daysBetween(a, b) { return Math.round((fromISO(b) - fromISO(a)) / 86400000); }
function monthKey(isoStr) { return isoStr.slice(0, 7); }
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
function fmtDate(isoStr) {
  if (!isoStr) return '—';
  var d = fromISO(isoStr);
  return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear();
}
function fmtShort(isoStr) { var d = fromISO(isoStr); return d.getDate() + ' ' + MON[d.getMonth()]; }
/* same, but keeps the year when it is not the current one — projections and
   far-off deadlines are meaningless without it */
function fmtShortY(isoStr) {
  var d = fromISO(isoStr), y = d.getFullYear();
  return d.getDate() + ' ' + MON[d.getMonth()] + (y !== new Date().getFullYear() ? " '" + String(y).slice(2) : '');
}
function fmtMonth(mk) { var p = mk.split('-'); return MON[+p[1] - 1] + ' ' + p[0]; }
function fmtMins(m) {
  m = Math.round(m || 0);
  if (m < 60) return m + 'm';
  var h = Math.floor(m / 60), r = m % 60;
  return r ? h + 'h ' + r + 'm' : h + 'h';
}
/* tight variant for calendar cells: 45m, 1h30, 2h */
function fmtMinsTight(m) {
  m = Math.round(m || 0);
  if (m < 60) return m + 'm';
  var h = Math.floor(m / 60), r = m % 60;
  return r ? h + 'h' + pad2(r) : h + 'h';
}

function fmtClock(sec) {
  sec = Math.max(0, Math.round(sec));
  return pad2(Math.floor(sec / 60)) + ':' + pad2(sec % 60);
}

/* ============================ course model =============================== */

function newCourse(o) {
  o = o || {};
  return {
    id: uid(),
    name: o.name || 'Untitled course',
    color: o.color || PALETTE[DB.courses.length % PALETTE.length],
    link: o.link || '',
    extraLinks: o.extraLinks || [],
    categories: o.categories || [],
    totalSessions: num(o.totalSessions, 0),
    doneOffset: num(o.doneOffset, 0),   // progress that happened before tracking
    deadline: o.deadline || '',
    status: o.status || 'active',       // active | completed | dropped
    notes: o.notes || '',
    extensions: [],
    createdAt: new Date().toISOString()
  };
}

function courseById(id) {
  for (var i = 0; i < DB.courses.length; i++) if (DB.courses[i].id === id) return DB.courses[i];
  return null;
}
function courseName(id) { var c = courseById(id); return c ? c.name : 'Deleted course'; }
/* the printerly palette is mixed for paper; on the blueprint ground the same
   hue has to be lifted toward the light or it disappears into the blue */
function tone(hex) {
  if (document.documentElement.getAttribute('data-theme') !== 'dark') return hex;
  var m = /^#?([0-9a-f]{6})$/i.exec(String(hex));
  if (!m) return hex;
  var v = parseInt(m[1], 16), f = 0.46;
  var mix = function (c, t) { return Math.round(c + (t - c) * f); };
  return 'rgb(' + mix((v >> 16) & 255, 226) + ',' + mix((v >> 8) & 255, 238) + ',' + mix(v & 255, 255) + ')';
}
function courseColor(id) { var c = courseById(id); return tone(c ? c.color : '#8892b0'); }
function activeCourses() { return DB.courses.filter(function (c) { return c.status === 'active'; }); }

/* progress = pre-existing offset + everything logged since */
function progressOf(course) {
  var logged = 0, mins = 0, last = '';
  DB.sessions.forEach(function (s) {
    if (s.courseId !== course.id) return;
    logged += num(s.count, 0);
    mins += num(s.minutes, 0);
    if (s.date > last) last = s.date;
  });
  var done = course.doneOffset + logged;
  var total = course.totalSessions;
  return {
    logged: logged, minutes: mins, done: done, total: total, last: last,
    remaining: total ? Math.max(0, total - done) : 0,
    pct: total ? clamp(Math.round(done / total * 100), 0, 100) : 0
  };
}

/* days until deadline; null when there is none */
function daysLeft(course) {
  if (!course.deadline) return null;
  return daysBetween(today(), course.deadline);
}

/* sessions/day needed to hit the deadline */
function paceNeeded(course) {
  var p = progressOf(course), dl = daysLeft(course);
  if (!course.totalSessions || dl === null || p.remaining <= 0) return null;
  if (dl <= 0) return Infinity;
  return p.remaining / dl;
}

/* ============================== analytics =============================== */

function sessionsInRange(fromIso, toIso) {
  return DB.sessions.filter(function (s) { return s.date >= fromIso && s.date <= toIso; });
}
function sumCount(list) { return list.reduce(function (a, s) { return a + num(s.count, 0); }, 0); }
function sumMins(list) { return list.reduce(function (a, s) { return a + num(s.minutes, 0); }, 0); }

function byDayMap() {
  var m = {};
  DB.sessions.forEach(function (s) {
    if (!m[s.date]) m[s.date] = { count: 0, minutes: 0, n: 0 };
    m[s.date].count += num(s.count, 0);
    m[s.date].minutes += num(s.minutes, 0);
    m[s.date].n++;
  });
  return m;
}

function streaks() {
  var m = byDayMap(), days = Object.keys(m).sort();
  if (!days.length) return { current: 0, longest: 0, activeDays: 0, first: '', last: '' };
  var longest = 1, run = 1;
  for (var i = 1; i < days.length; i++) {
    run = daysBetween(days[i - 1], days[i]) === 1 ? run + 1 : 1;
    if (run > longest) longest = run;
  }
  // current streak counts back from today; a gap of one day (today not yet
  // logged) still keeps yesterday's streak alive
  var cur = 0, cursor = today();
  if (!m[cursor]) cursor = shiftDays(cursor, -1);
  while (m[cursor]) { cur++; cursor = shiftDays(cursor, -1); }
  return { current: cur, longest: longest, activeDays: days.length, first: days[0], last: days[days.length - 1] };
}

function monthlySummary() {
  var m = {};
  DB.sessions.forEach(function (s) {
    var k = monthKey(s.date);
    if (!m[k]) m[k] = { key: k, count: 0, minutes: 0, days: {}, courses: {} };
    var b = m[k];
    b.count += num(s.count, 0);
    b.minutes += num(s.minutes, 0);
    b.days[s.date] = 1;
    b.courses[s.courseId] = (b.courses[s.courseId] || 0) + num(s.minutes, 0);
  });
  return Object.keys(m).sort().reverse().map(function (k) {
    var b = m[k], top = '', best = -1;
    Object.keys(b.courses).forEach(function (cid) { if (b.courses[cid] > best) { best = b.courses[cid]; top = cid; } });
    b.activeDays = Object.keys(b.days).length;
    b.topCourse = top;
    return b;
  });
}

/* topic → sessions & co-occurrence, the raw material for the brain map */
function topicStats() {
  var nodes = {}, links = {};
  DB.sessions.forEach(function (s) {
    var ts = (s.topics || []).slice();
    ts.forEach(function (t) {
      var key = s.courseId + '::' + t;
      if (!nodes[key]) nodes[key] = { key: key, topic: t, courseId: s.courseId, count: 0, minutes: 0, last: '' };
      nodes[key].count += num(s.count, 1);
      nodes[key].minutes += num(s.minutes, 0);
      if (s.date > nodes[key].last) nodes[key].last = s.date;
    });
    for (var i = 0; i < ts.length; i++) {
      for (var j = i + 1; j < ts.length; j++) {
        var a = s.courseId + '::' + ts[i], b = s.courseId + '::' + ts[j];
        var lk = a < b ? a + '|' + b : b + '|' + a;
        links[lk] = (links[lk] || 0) + 1;
      }
    }
  });
  return { nodes: nodes, links: links };
}

/* ============================== chrome ================================== */

function toast(msg, ms, actionLabel, actionFn) {
  var wrap = $('#toasts');
  var t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<span>' + msg + '</span>';
  if (actionLabel) {
    var b = document.createElement('button');
    b.className = 'btn sm primary';
    b.textContent = actionLabel;
    b.onclick = function () { actionFn(); t.remove(); };
    t.appendChild(b);
  }
  wrap.appendChild(t);
  setTimeout(function () { t.remove(); }, ms || 2600);
}

/* modal: html string in, optional onMount(box); Esc / scrim closes */
function modal(html, onMount, wide) {
  var root = $('#modal-root'), box = $('#modal-box');
  box.className = 'modal' + (wide ? ' wide' : '');
  box.innerHTML = html;
  root.classList.add('on');
  if (onMount) onMount(box);
  var first = box.querySelector('input,select,textarea,button');
  if (first && first.focus) setTimeout(function () { first.focus(); }, 30);
}
function modalClose() {
  $('#modal-root').classList.remove('on');
  $('#modal-box').innerHTML = '';
}
function confirmBox(title, body, okLabel, onOk) {
  modal(
    '<h2>' + esc(title) + '</h2><p class="sub">' + body + '</p>' +
    '<div class="modal-foot"><button class="btn" data-act="modal-close">Cancel</button>' +
    '<button class="btn danger" id="cb-ok">' + esc(okLabel) + '</button></div>',
    function (box) { box.querySelector('#cb-ok').onclick = function () { modalClose(); onOk(); }; }
  );
}

/* delegated actions: any element with data-act="name" calls ACTIONS.name(el) */
var ACTIONS = {};

/* ------- inputs -------- */

/* a big +/- number field. `name` keys the -/+ buttons and the preset chips;
   the optional `role` lets a form read the field back by DOM scope instead of
   by a global id (see 10-log.js) */
function stepper(name, value, step, min, max, role) {
  return '<div class="stepper">' +
    '<button type="button" data-act="step" data-for="' + name + '" data-by="-' + (step || 1) + '">\u2212</button>' +
    '<input type="number" data-num="' + name + '"' + (role ? ' data-role="' + role + '"' : '') +
    ' value="' + value + '" step="' + (step || 1) + '"' +
    (min != null ? ' min="' + min + '"' : '') + (max != null ? ' max="' + max + '"' : '') + '>' +
    '<button type="button" data-act="step" data-for="' + name + '" data-by="' + (step || 1) + '">+</button>' +
    '</div>';
}
ACTIONS.step = function (el) {
  var f = el.getAttribute('data-for'), by = num(el.getAttribute('data-by'), 1);
  var inp = document.querySelector('[data-num="' + f + '"]');
  if (!inp) return;
  var min = inp.min === '' ? -Infinity : num(inp.min, -Infinity);
  var max = inp.max === '' ? Infinity : num(inp.max, Infinity);
  inp.value = clamp(num(inp.value, 0) + by, min, max);
  inp.dispatchEvent(new Event('input', { bubbles: true }));
};
function readNum(name, d) {
  var inp = document.querySelector('[data-num="' + name + '"]');
  return inp ? num(inp.value, d || 0) : (d || 0);
}
function courseOptions(selected, includeAll) {
  var out = includeAll ? '<option value="">All courses</option>' : '';
  DB.courses.forEach(function (c) {
    if (c.status === 'dropped' && c.id !== selected) return;
    out += '<option value="' + c.id + '"' + (c.id === selected ? ' selected' : '') + '>' +
      esc(c.name) + (c.status === 'completed' ? ' (completed)' : '') + '</option>';
  });
  return out;
}

/* ===== 03-store.js ===== */
/* =============================================================================
   03-store — the record lives in the repo, at data/study-data.js.

   Reading it needs no server: the file is a plain script that sets
   window.STUDY_DATA, and index.html loads it with a <script> tag, which works
   from file:// where fetch() of a sibling file does not. So `git clone`, open
   index.html, and last night's log is already there.

   Writing it needs the browser's permission, once. On Chrome/Edge/Arc the app
   asks you to point at data/study-data.js the first time ("Connect data file");
   after that every change is written straight into the repo, silently, no
   command and no server. The handle is remembered in IndexedDB, so it survives
   restarts — a click may be needed to re-grant write access after reopening.

   Where that API is missing (Safari, Firefox) the same button downloads the
   file and you drop it into data/ — one drag instead of a terminal.

   localStorage is still written on every change as the working copy, so nothing
   is ever lost between writes to the repo file.
   ========================================================================== */

var STORE = {
  name: 'data/study-data.js',
  can: !!(window.showSaveFilePicker),   // real in-place writing available?
  file: null,                           // FileSystemFileHandle once connected
  granted: false,                       // write permission live right now
  dirty: false,                         // changes not yet in the repo file
  savedAt: null,                        // when we last wrote it
  fromRepo: false,                      // did this session boot from the file?
  busy: false, again: false, error: null
};

var storeTimer = null;
var STASH_KEY = STORE_KEY + '-superseded';
var SEEN_KEY = STORE_KEY + '-file-seen';    // savedAt of the file version we last synced with

/* ---------- the committed file ---------- */

/* what the <script> tag left behind, if anything */
function storeRepoRecord() {
  var rec = window.STUDY_DATA;
  if (!rec || typeof rec !== 'object') return null;
  if (!(rec.courses || []).length && !(rec.sessions || []).length) return null;
  return rec;
}

function storeSummary(rec) {
  rec = rec || {};
  return {
    courses: (rec.courses || []).length,
    sessions: (rec.sessions || []).length,
    savedAt: rec.savedAt || '',
    empty: !(rec.courses || []).length && !(rec.sessions || []).length
  };
}

/* the file's own contents: data as a script, so it loads without a server */
function storeText() {
  return '/* Study Tracker — your data. Written by the app; commit it with the repo.\n' +
    '   Loaded by index.html through a <' + 'script> tag, which is why this is .js and not .json.\n' +
    '   Last write: ' + new Date().toISOString() + ' */\n' +
    'window.STUDY_DATA = ' + JSON.stringify(DB, null, 1) + ';\n';
}

/* ---------- remembering the file between visits ---------- */

function storeIDB(fn) {
  try {
    var req = indexedDB.open('study-tracker-file', 1);
    req.onupgradeneeded = function () { req.result.createObjectStore('h'); };
    req.onsuccess = function () { fn(req.result); };
    req.onerror = function () { fn(null); };
  } catch (e) { fn(null); }
}
function storeRemember(handle) {
  storeIDB(function (db) {
    if (!db) return;
    try { db.transaction('h', 'readwrite').objectStore('h').put(handle, 'file'); } catch (e) { /* ignore */ }
  });
}
function storeForget() {
  storeIDB(function (db) {
    if (!db) return;
    try { db.transaction('h', 'readwrite').objectStore('h').delete('file'); } catch (e) { /* ignore */ }
  });
}
function storeRecall(cb) {
  storeIDB(function (db) {
    if (!db) return cb(null);
    try {
      var r = db.transaction('h').objectStore('h').get('file');
      r.onsuccess = function () { cb(r.result || null); };
      r.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  });
}

/* ---------- permission ---------- */

/* ask = false only checks; asking needs a click, so it is never done silently */
function storePermission(ask, cb) {
  var h = STORE.file;
  if (!h) return cb(false);
  if (!h.queryPermission) { STORE.granted = true; return cb(true); }
  h.queryPermission({ mode: 'readwrite' }).then(function (p) {
    if (p === 'granted') { STORE.granted = true; return cb(true); }
    if (!ask) { STORE.granted = false; return cb(false); }
    h.requestPermission({ mode: 'readwrite' }).then(function (p2) {
      STORE.granted = p2 === 'granted';
      cb(STORE.granted);
    }, function () { cb(false); });
  }, function () { cb(false); });
}

/* ---------- writing ---------- */

/* called by dbSave on every change: debounced, and silent when allowed */
function storeQueue() {
  if (!STORE.file || !STORE.granted) { STORE.dirty = true; storeRefreshLine(); return; }
  clearTimeout(storeTimer);
  storeTimer = setTimeout(function () { storeWrite(); }, 500);
}

function storeWrite(cb) {
  if (!STORE.file) { STORE.dirty = true; storeRefreshLine(); if (cb) cb(false); return; }
  if (STORE.busy) { STORE.again = true; if (cb) cb(false); return; }
  STORE.busy = true;
  var text = storeText();
  storePermission(false, function (ok) {
    if (!ok) {
      STORE.busy = false;
      STORE.dirty = true;
      storeRefreshLine();
      if (cb) cb(false);
      return;
    }
    STORE.file.createWritable().then(function (w) {
      return w.write(text).then(function () { return w.close(); });
    }).then(function () {
      STORE.busy = false;
      STORE.dirty = false;
      STORE.error = null;
      STORE.savedAt = new Date().toISOString();
      storeMarkSeen(DB.savedAt || '');          // this is now the version we have seen
      storeRefreshLine();
      if (STORE.again) { STORE.again = false; storeWrite(); }
      if (cb) cb(true);
    }).catch(function (e) {
      STORE.busy = false;
      STORE.dirty = true;
      STORE.error = String((e && e.message) || e);
      storeRefreshLine();
      if (cb) cb(false);
    });
  });
}

/* ---------- connecting, at the user's click ---------- */

ACTIONS['store-connect'] = function () {
  if (!STORE.can) { ACTIONS['store-download'](); return; }
  window.showSaveFilePicker({
    suggestedName: 'study-data.js',
    types: [{ description: 'Study Tracker data', accept: { 'text/javascript': ['.js'] } }]
  }).then(function (h) {
    STORE.file = h;
    storeRemember(h);
    return new Promise(function (res) { storePermission(true, res); });
  }).then(function (ok) {
    if (!ok) { toast('Write permission was not granted'); return; }
    storeWrite(function (done) {
      toast(done ? 'Connected — every change now writes ' + esc(STORE.name) : 'Could not write the file');
      route();
    });
  }).catch(function (e) {
    if (e && e.name === 'AbortError') return;             // the user cancelled
    toast('Could not open the file picker — use Download instead', 5000);
  });
};

/* re-grant after a restart: one click, no picker */
ACTIONS['store-reconnect'] = function () {
  if (!STORE.file) { ACTIONS['store-connect'](); return; }
  storePermission(true, function (ok) {
    if (!ok) { toast('Write permission was not granted'); return; }
    storeWrite(function (done) {
      toast(done ? 'Writing to ' + esc(STORE.name) + ' again' : 'Could not write the file');
      route();
    });
  });
};

ACTIONS['store-save-now'] = function () {
  if (STORE.file) {
    storePermission(true, function (ok) {
      if (!ok) { toast('Write permission was not granted'); return; }
      storeWrite(function (done) { toast(done ? 'Saved to ' + esc(STORE.name) : 'Write failed'); route(); });
    });
    return;
  }
  ACTIONS['store-download']();
};

ACTIONS['store-download'] = function () {
  downloadFile('study-data.js', storeText(), 'text/javascript');
  storeMarkSeen(DB.savedAt || '');            // the copy you are about to drop in
  STORE.dirty = false;
  storeRefreshLine();
  toast('Downloaded study-data.js — drop it into the data folder of the repo', 7000);
  route();
};

ACTIONS['store-disconnect'] = function () {
  STORE.file = null;
  STORE.granted = false;
  storeForget();
  toast('Disconnected — changes stay in this browser until you save the file');
  route();
};

/* ---------- boot ---------- */

/* which version of the file this browser has already taken in */
function storeSeen() {
  try { return localStorage.getItem(SEEN_KEY) || ''; } catch (e) { return ''; }
}
function storeMarkSeen(stamp) {
  try { localStorage.setItem(SEEN_KEY, stamp || ''); } catch (e) { /* ignore */ }
}

/* Pick between the committed file and this browser's working copy.

   Timestamps alone cannot tell "the file changed elsewhere" from "this browser
   moved on", and a file written by a machine with a skewed clock would keep
   winning. So the deciding question is whether the file is a version this
   browser has NOT seen before (someone committed, you pulled) — only then does
   it win. Otherwise the local copy, which may hold unsaved work, is kept. */
function storeChoose(repoRec, localRec) {
  var r = storeSummary(repoRec), l = storeSummary(localRec);
  if (!repoRec && !localRec) return { rec: null, source: 'none' };
  if (!repoRec) return { rec: localRec, source: 'browser' };
  if (!localRec || l.empty) return { rec: repoRec, source: 'repo' };

  var fileIsNew = (r.savedAt || '') !== storeSeen();
  if (fileIsNew) return { rec: repoRec, source: 'repo' };
  return { rec: localRec, source: 'browser' };
}

/* after the UI is up: quietly reattach the file we were writing last time */
function storeReattach() {
  if (!STORE.can) return;
  storeRecall(function (h) {
    if (!h) return;
    STORE.file = h;
    storePermission(false, function (ok) {
      storeRefreshLine();
      if (ok && STORE.dirty) storeWrite();
    });
  });
}

/* a cheap identity for a record: which sessions and courses it actually holds.
   Counting alone is not enough — two copies can hold three different sessions. */
function storeSig(rec) {
  rec = rec || {};
  var ses = (rec.sessions || []).map(function (s) { return s.id; }).sort().join('|');
  var crs = (rec.courses || []).map(function (c) { return c.id; }).sort().join('|');
  return ses + '#' + crs;
}

/* When the file wins at startup, the browser copy it replaced is stashed rather
   than dropped: neither a skewed clock nor a stale commit may eat work. */
function storeStash(rec) {
  try { localStorage.setItem(STASH_KEY, JSON.stringify(rec)); } catch (e) { /* ignore */ }
}
function storeStashed() {
  try {
    var raw = localStorage.getItem(STASH_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
ACTIONS['store-stash-restore'] = function () {
  var rec = storeStashed();
  if (!rec) { toast('Nothing stashed'); return; }
  var sm = storeSummary(rec);
  confirmBox('Go back to the superseded copy?',
    'It has <b>' + sm.sessions + ' sessions</b> across ' + sm.courses + ' courses' +
    (sm.savedAt ? ', last saved ' + esc(String(sm.savedAt).replace('T', ' ').slice(0, 16)) : '') +
    '. This replaces what is loaded now; the data file is only overwritten when you save.',
    'Use that copy', function () {
      DB = Object.assign(blankDB(), rec);
      DB.profile = Object.assign(blankDB().profile, rec.profile || {});
      DB.pomoCfg = Object.assign(blankDB().pomoCfg, rec.pomoCfg || {});
      ['courses', 'sessions', 'resources', 'notebooks'].forEach(function (k) {
        if (!Array.isArray(DB[k])) DB[k] = [];
      });
      try { localStorage.removeItem(STASH_KEY); } catch (e) { /* ignore */ }
      STORE.dirty = true;
      dbSave(true);
      toast('Restored — save it to the data file when you are happy with it', 6000);
      route();
    });
};
ACTIONS['store-stash-drop'] = function () {
  try { localStorage.removeItem(STASH_KEY); } catch (e) { /* ignore */ }
  toast('Discarded');
  route();
};

/* ---------- status ---------- */

function storeLine() {
  var where = 'The record for this repo is <b>' + esc(STORE.name) + '</b>, loaded when you open the app.';
  if (!STORE.can) {
    return where + ' This browser cannot write files in place, so changes are kept here and you ' +
      'update the file with <b>Download data file</b>, then drop it into <code>data/</code>. ' +
      'Chrome, Edge or Arc can write it directly.' +
      (STORE.dirty ? ' <span style="color:var(--sale)">There are changes not yet in the file.</span>' : '');
  }
  if (STORE.file && STORE.granted) {
    return where + ' Connected: every change is written straight into it' +
      (STORE.savedAt ? ', last write ' + esc(STORE.savedAt.replace('T', ' ').slice(0, 19)) : '') + '.' +
      (STORE.error ? ' <span style="color:var(--sale)">Last attempt failed: ' + esc(STORE.error) + '</span>' : '');
  }
  if (STORE.file) {
    return where + ' <b>Write access needs one click</b> after reopening the browser — until then changes ' +
      'stay in this browser.' + (STORE.dirty ? ' <span style="color:var(--sale)">Unsaved changes are waiting.</span>' : '');
  }
  return where + ' Not connected yet: <b>Connect data file</b> and point at ' + esc(STORE.name) +
    ' once, and from then on the app writes it itself.' +
    (STORE.dirty ? ' <span style="color:var(--sale)">Changes so far are only in this browser.</span>' : '');
}

function storeRefreshLine() {
  var el = $('#store-line');
  if (el) el.innerHTML = storeLine();
  var foot = $('#store-foot');
  if (foot) {
    foot.innerHTML = (STORE.file && STORE.granted)
      ? 'Writing to <b>' + esc(STORE.name) + '</b>. <a href="#/data">Data</a>.'
      : (STORE.dirty ? '<b>Unsaved</b> to the repo file. <a href="#/data">Save it</a>.'
                     : 'Working copy in this browser. <a href="#/data">Data</a>.');
  }
}

/* the buttons for the Data page, in the order that makes sense right now */
function storeButtonsHTML() {
  var b = [];
  if (STORE.can && !STORE.file) b.push('<button class="btn primary" data-act="store-connect">Connect data file</button>');
  if (STORE.can && STORE.file && !STORE.granted) b.push('<button class="btn primary" data-act="store-reconnect">Allow writing again</button>');
  if (STORE.file && STORE.granted) b.push('<button class="btn" data-act="store-save-now">Save now</button>');
  b.push('<button class="btn' + (!STORE.can && STORE.dirty ? ' primary' : '') + '" data-act="store-download">Download data file</button>');
  if (STORE.file) b.push('<button class="btn ghost" data-act="store-disconnect">Disconnect</button>');
  return b.join('');
}

/* ===== 05-charts.js ===== */
/* =============================================================================
   05-charts — small inline SVG charts, drawn like a drafting sheet: hatched
   fills, hairline axes with end ticks, and a light turbulence filter so the
   strokes read as hand-drawn. No chart library.

   Every chart mints its own ids (CH_ID) because several live on one page.
   ========================================================================== */

var CH_ID = 0;

/* the wobble + one hatch pattern per colour used */
function chartDefs(id, colors) {
  var d = '<defs>' +
    '<filter id="' + id + '-rough" x="-8%" y="-8%" width="116%" height="116%">' +
      '<feTurbulence type="fractalNoise" baseFrequency="0.015 0.03" numOctaves="2" seed="' + (id.length * 7 % 90) + '" result="n"/>' +
      '<feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>' +
    '</filter>';
  (colors || []).forEach(function (c, i) {
    d += '<pattern id="' + id + '-h' + i + '" width="7" height="7" patternUnits="userSpaceOnUse" ' +
      'patternTransform="rotate(' + (25 + i * 27) + ')">' +
      '<rect width="7" height="7" fill="' + c + '" fill-opacity=".12"/>' +
      '<line x1="0" y1="0" x2="0" y2="7" stroke="' + c + '" stroke-width="1.7"/>' +
      '</pattern>';
  });
  return d + '</defs>';
}

/* ------------------------------- bars ---------------------------------- */
function barsSVG(items, opts) {
  opts = opts || {};
  var id = 'c' + (++CH_ID);
  var W = opts.w || 720, H = opts.h || 160, padL = 6, padR = 6, top = 20;
  var accent = 'var(--accent)';
  var max = 0;
  items.forEach(function (i) { if (i.v > max) max = i.v; });
  max = max || 1;
  var bw = (W - padL - padR) / Math.max(1, items.length);
  var body = '';

  /* dashed guide lines, like a scale on a drawing */
  var guides = '';
  [0.25, 0.5, 0.75, 1].forEach(function (f) {
    var y = top + (H - top) * (1 - f);
    guides += '<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) +
      '" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 4"/>';
  });

  items.forEach(function (i, n) {
    var h = i.v / max * (H - top);
    var x = padL + n * bw, y = H - h;
    if (i.v > 0) {
      body += '<rect x="' + (x + bw * 0.17).toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + (bw * 0.66).toFixed(1) +
        '" height="' + Math.max(1.5, h).toFixed(1) + '" fill="url(#' + id + '-h0)" stroke="' + accent + '" stroke-width="1"/>';
    }
  });

  var labels = '';
  items.forEach(function (i, n) {
    var h = i.v / max * (H - top), x = padL + n * bw, y = H - h;
    if (i.v && items.length <= 16) {
      labels += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + Math.max(11, y - 5).toFixed(1) +
        '" text-anchor="middle" font-size="10" fill="var(--ink-2)">' + esc(opts.fmt ? opts.fmt(i.v) : i.v) + '</text>';
    }
    if (!opts.hideLabels && (items.length <= 16 || n % 2 === 0)) {
      labels += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H + 15) + '" text-anchor="middle" font-size="10" fill="var(--ink-3)">' +
        esc(i.label) + '</text>';
    }
    labels += '<line x1="' + (x + bw / 2).toFixed(1) + '" y1="' + H + '" x2="' + (x + bw / 2).toFixed(1) + '" y2="' + (H + 4) +
      '" stroke="var(--rule-2)" stroke-width="1"/>';
  });

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 24) + '">' +
    chartDefs(id, [accent]) + guides +
    '<g filter="url(#' + id + '-rough)">' + body +
      '<line x1="' + padL + '" y1="' + H + '" x2="' + (W - padR) + '" y2="' + H + '" stroke="var(--ink-3)" stroke-width="1.2"/>' +
    '</g>' + labels +
    '</svg>';
}

/* ------------------------------- donut ---------------------------------- */
/* items: [{label, v, color}] — slices hatched, total in the middle */
function donutSVG(items, opts) {
  opts = opts || {};
  var id = 'c' + (++CH_ID);
  var S = opts.size || 230, cx = S / 2, cy = S / 2;
  var R = S / 2 - 14, r = R * (opts.hole || 0.56);
  var total = items.reduce(function (a, i) { return a + i.v; }, 0);
  if (!total) return '<div class="empty">Nothing to plot yet.</div>';

  var colors = items.map(function (i) { return i.color || 'var(--accent)'; });
  var a0 = -Math.PI / 2, out = '';
  items.forEach(function (it, n) {
    var a1 = a0 + (it.v / total) * Math.PI * 2;
    var big = (a1 - a0) > Math.PI ? 1 : 0;
    var x0 = cx + R * Math.cos(a0), y0 = cy + R * Math.sin(a0);
    var x1 = cx + R * Math.cos(a1), y1 = cy + R * Math.sin(a1);
    var xi1 = cx + r * Math.cos(a1), yi1 = cy + r * Math.sin(a1);
    var xi0 = cx + r * Math.cos(a0), yi0 = cy + r * Math.sin(a0);
    out += '<path d="M' + x0.toFixed(1) + ' ' + y0.toFixed(1) +
      ' A' + R + ' ' + R + ' 0 ' + big + ' 1 ' + x1.toFixed(1) + ' ' + y1.toFixed(1) +
      ' L' + xi1.toFixed(1) + ' ' + yi1.toFixed(1) +
      ' A' + r + ' ' + r + ' 0 ' + big + ' 0 ' + xi0.toFixed(1) + ' ' + yi0.toFixed(1) + ' Z" ' +
      'fill="url(#' + id + '-h' + n + ')" stroke="' + colors[n] + '" stroke-width="1.1"><title>' +
      esc(it.label + ' — ' + (opts.fmt ? opts.fmt(it.v) : it.v) + ' (' + Math.round(it.v / total * 100) + '%)') +
      '</title></path>';
    a0 = a1;
  });

  var mid = opts.centre || (opts.fmt ? opts.fmt(total) : String(total));
  return '<svg class="chart" viewBox="0 0 ' + S + ' ' + S + '" style="max-width:' + S + 'px;margin:0 auto">' +
    chartDefs(id, colors) +
    '<g filter="url(#' + id + '-rough)">' + out + '</g>' +
    '<text x="' + cx + '" y="' + (cy - 1) + '" text-anchor="middle" font-size="20" font-weight="600" fill="var(--ink)">' + esc(mid) + '</text>' +
    (opts.centreNote ? '<text x="' + cx + '" y="' + (cy + 16) + '" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="var(--ink-3)">' +
      esc(String(opts.centreNote).toUpperCase()) + '</text>' : '') +
    '</svg>';
}

/* the matching legend, as drawn swatches */
function legendHTML(items, opts) {
  opts = opts || {};
  var total = items.reduce(function (a, i) { return a + i.v; }, 0) || 1;
  return '<div class="legend">' + items.map(function (i) {
    return '<div class="lrow">' +
      '<span class="sw" style="background:' + (i.color || 'var(--accent)') + '"></span>' +
      '<span class="lname">' + esc(i.label) + '</span>' +
      '<span class="lval">' + esc(opts.fmt ? opts.fmt(i.v) : i.v) + '</span>' +
      '<span class="lpct">' + Math.round(i.v / total * 100) + '%</span>' +
      '</div>';
  }).join('') + '</div>';
}

/* ------------------------------- line ---------------------------------- */
/* points: [{label, v}] — a hand-drawn trend line with a hatched underside */
function lineSVG(points, opts) {
  opts = opts || {};
  var id = 'c' + (++CH_ID);
  var W = opts.w || 720, H = opts.h || 150, pad = 8, top = 14;
  var max = 0;
  points.forEach(function (p) { if (p.v > max) max = p.v; });
  max = max || 1;
  var step = (W - pad * 2) / Math.max(1, points.length - 1);
  var xy = points.map(function (p, i) {
    return [pad + i * step, top + (H - top) * (1 - p.v / max)];
  });
  var d = xy.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
  var area = d + ' L' + xy[xy.length - 1][0].toFixed(1) + ' ' + H + ' L' + xy[0][0].toFixed(1) + ' ' + H + ' Z';

  var ticks = '';
  points.forEach(function (p, i) {
    if (!p.label) return;
    if (points.length > 12 && i % Math.ceil(points.length / 8) !== 0) return;
    ticks += '<line x1="' + xy[i][0].toFixed(1) + '" y1="' + H + '" x2="' + xy[i][0].toFixed(1) + '" y2="' + (H + 4) +
      '" stroke="var(--rule-2)" stroke-width="1"/>' +
      '<text x="' + xy[i][0].toFixed(1) + '" y="' + (H + 15) + '" text-anchor="middle" font-size="10" fill="var(--ink-3)">' +
      esc(p.label) + '</text>';
  });

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + (H + 22) + '">' +
    chartDefs(id, ['var(--accent)']) +
    '<line x1="' + pad + '" y1="' + top + '" x2="' + (W - pad) + '" y2="' + top + '" stroke="var(--rule)" stroke-width="1" stroke-dasharray="2 4"/>' +
    '<g filter="url(#' + id + '-rough)">' +
      '<path d="' + area + '" fill="url(#' + id + '-h0)" stroke="none"/>' +
      '<path d="' + d + '" fill="none" stroke="var(--accent)" stroke-width="1.6"/>' +
      '<line x1="' + pad + '" y1="' + H + '" x2="' + (W - pad) + '" y2="' + H + '" stroke="var(--ink-3)" stroke-width="1.2"/>' +
    '</g>' + ticks +
    '<text x="' + (W - pad) + '" y="' + (top - 4) + '" text-anchor="end" font-size="10" fill="var(--ink-3)">' +
      esc(opts.fmt ? opts.fmt(max) : max) + '</text>' +
    '</svg>';
}

/* ---------------------------- data shapers ------------------------------ */

/* minutes per course over a set of sessions, biggest first, tail folded in */
function timeByCourse(list, maxSlices) {
  var m = {};
  list.forEach(function (s) { m[s.courseId] = (m[s.courseId] || 0) + num(s.minutes, 0); });
  var items = Object.keys(m).map(function (cid) {
    return { label: courseName(cid), v: m[cid], color: courseColor(cid) };
  }).sort(function (a, b) { return b.v - a.v; });
  if (maxSlices && items.length > maxSlices) {
    var rest = items.slice(maxSlices - 1).reduce(function (a, i) { return a + i.v; }, 0);
    items = items.slice(0, maxSlices - 1);
    items.push({ label: 'Everything else', v: rest, color: 'var(--ink-3)' });
  }
  return items;
}

/* minutes per topic, across courses */
function timeByTopic(list, maxSlices) {
  var m = {}, col = {};
  list.forEach(function (s) {
    (s.topics || []).forEach(function (t) {
      m[t] = (m[t] || 0) + num(s.minutes, 0) / (s.topics.length || 1);
      col[t] = courseColor(s.courseId);
    });
  });
  var items = Object.keys(m).map(function (t) {
    return { label: t, v: Math.round(m[t]), color: col[t] };
  }).sort(function (a, b) { return b.v - a.v; });
  return maxSlices ? items.slice(0, maxSlices) : items;
}

/* ===== 10-log.js ===== */
/* =============================================================================
   10-log — the quick-log form (the thing you touch every day) and session edit.

   Design goal: log a session in ~3 keystrokes. The form remembers the last
   course, defaults minutes to your usual session length, and Enter saves.

   IMPORTANT — why this file looks paranoid about which form it is reading:
   the same form can be on screen twice (inline on the Dashboard, and inside a
   dialog opened from anywhere else), and a dialog can be dismissed without the
   page re-rendering. So the form is NEVER resolved from a module-level
   variable; it is resolved from the DOM, starting at the button that was
   clicked (`[data-logform]` ancestor) and reading fields by `data-role` inside
   that one element. If the form cannot be resolved, saving refuses rather than
   quietly writing default values.
   ========================================================================== */

var LOGF = { courseId: null, date: null, topics: [], p: 'log' };

function logReset(dateIso) {
  LOGF.courseId = DB.lastCourseId && courseById(DB.lastCourseId) && courseById(DB.lastCourseId).status === 'active'
    ? DB.lastCourseId
    : (activeCourses()[0] ? activeCourses()[0].id : null);
  LOGF.date = dateIso || today();
  LOGF.topics = [];
}

/* ---- resolving the live form ---- */

/* the form the user is actually in: the one containing the clicked control,
   else the one inside an open dialog, else the one on the page */
function logRoot(el) {
  if (el && el.closest) {
    var owned = el.closest('[data-logform]');
    if (owned) return owned;
  }
  if ($('#modal-root').classList.contains('on')) {
    var inModal = $('#modal-box [data-logform]');
    if (inModal) return inModal;
  }
  return $('[data-logform]');
}
function logField(root, role) { return root ? root.querySelector('[data-role="' + role + '"]') : null; }
function logNum(root, role, dflt) {
  var i = logField(root, role);
  if (!i) return null;                       // missing field: the caller decides
  var n = parseFloat(i.value);
  return isFinite(n) ? n : dflt;
}

function topicPickerHTML(courseId, chosen) {
  var c = courseById(courseId);
  if (!c) return '';
  var cats = c.categories || [];
  var html = '<label class="f">Topics covered <span class="plain">— these grow your brain map</span></label>';
  if (!cats.length) {
    html += '<div class="hint" style="margin:0 0 8px">No topics on this course yet. Add a few — they become the nodes of your map.</div>';
  }
  html += '<div class="chips" style="margin-bottom:8px">';
  cats.forEach(function (t) {
    var on = chosen.indexOf(t) >= 0;
    html += '<button type="button" class="chip' + (on ? ' on' : '') + '" data-act="log-topic" data-topic="' + esc(t) + '">' + esc(t) + '</button>';
  });
  html += '<button type="button" class="chip" data-act="log-newtopic">+ add topic</button>';
  html += '</div>';
  return html;
}

/* opts.prefix only keeps the stepper/chip targets unique between two copies */
function logCardHTML(opts) {
  opts = opts || {};
  var p = opts.prefix || 'log';
  LOGF.p = p;
  var courses = DB.courses.filter(function (c) { return c.status !== 'dropped'; });
  if (!courses.length) {
    return '<div class="card"><h2>Log a session</h2><div class="empty">Add a course first — ' +
      '<a href="#/classroom">go to Classroom</a>.</div></div>';
  }
  var mins = DB.profile.sessionMinutes || 45;
  return '' +
  '<div class="card" id="' + p + '-card" data-logform="' + p + '">' +
    '<div class="row" style="margin-bottom:14px"><h2 style="margin:0">Log a session</h2>' +
      '<span class="spacer"></span>' +
      '<span class="mini">Enter saves</span></div>' +
    '<div class="grid" style="gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">' +
      '<div class="field"><label class="f">Course</label>' +
        '<select data-role="course">' + courseOptions(LOGF.courseId) + '</select></div>' +
      '<div class="field"><label class="f">Date</label>' +
        '<input type="date" data-role="date" value="' + esc(LOGF.date || today()) + '" max="' + today() + '"></div>' +
    '</div>' +
    '<div class="grid" style="gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))">' +
      '<div class="field"><label class="f">Sessions / lectures done</label>' + stepper(p + '-count', 1, 1, 0, 99, 'count') +
        '<div class="chips" style="margin-top:8px">' +
          [1, 2, 3, 5].map(function (n) { return '<button type="button" class="chip" data-act="set-num" data-target="' + p + '-count" data-val="' + n + '">' + n + '</button>'; }).join('') +
        '</div></div>' +
      '<div class="field"><label class="f">Minutes studied</label>' + stepper(p + '-mins', mins, 5, 0, 1440, 'mins') +
        '<div class="chips" style="margin-top:8px">' +
          [15, 25, 45, 60, 90, 120].map(function (n) { return '<button type="button" class="chip" data-act="set-num" data-target="' + p + '-mins" data-val="' + n + '">' + n + '</button>'; }).join('') +
        '</div></div>' +
    '</div>' +
    '<div class="field" data-role="topics">' + topicPickerHTML(LOGF.courseId, LOGF.topics) + '</div>' +
    '<div class="field"><label class="f">Note (optional)</label>' +
      '<input type="text" data-role="note" placeholder="e.g. finished Ch.4 problems, revisit Bayes"></div>' +
    '<div class="row"><button class="btn primary" data-act="log-save">Save session</button>' +
      '<span class="mini" data-role="echo"></span></div>' +
  '</div>';
}

function wireLog() {
  var root = $('[data-logform="' + LOGF.p + '"]');
  if (!root) return;
  var sel = logField(root, 'course');
  sel.onchange = function () {
    LOGF.courseId = sel.value;
    LOGF.topics = [];
    logField(root, 'topics').innerHTML = topicPickerHTML(LOGF.courseId, LOGF.topics);
    updateLogEcho(root);
  };
  var d = logField(root, 'date');
  if (d) d.onchange = function () { LOGF.date = d.value; updateLogEcho(root); };
  ['count', 'mins'].forEach(function (role) {
    var i = logField(root, role);
    if (i) i.addEventListener('input', function () { updateLogEcho(root); });
  });
  root.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
      ACTIONS['log-save'](e.target);          // pass the field, so the form resolves from it
    }
  });
  updateLogEcho(root);
}

function updateLogEcho(root) {
  root = root || logRoot(null);
  var e = logField(root, 'echo');
  if (!e) return;
  var sel = logField(root, 'course');
  var c = courseById(sel ? sel.value : LOGF.courseId);
  if (!c) { e.textContent = ''; return; }
  var pr = progressOf(c);
  var add = logNum(root, 'count', 0) || 0, mins = logNum(root, 'mins', 0) || 0;
  e.innerHTML = c.totalSessions
    ? 'After saving: <b>' + (pr.done + add) + ' / ' + c.totalSessions + '</b> sessions, <b>' + fmtMins(pr.minutes + mins) + '</b> tracked'
    : 'After saving: <b>' + fmtMins(pr.minutes + mins) + '</b> tracked on ' + esc(c.name);
}

ACTIONS['set-num'] = function (el) {
  var t = el.getAttribute('data-target');
  var inp = document.querySelector('[data-num="' + t + '"]');
  if (inp) { inp.value = el.getAttribute('data-val'); inp.dispatchEvent(new Event('input', { bubbles: true })); }
};

ACTIONS['log-topic'] = function (el) {
  var t = el.getAttribute('data-topic');
  var i = LOGF.topics.indexOf(t);
  if (i >= 0) LOGF.topics.splice(i, 1); else LOGF.topics.push(t);
  el.classList.toggle('on');
};

/* adding a topic happens inline — a dialog here would wipe a half-filled form
   when the log form is itself inside the dialog */
ACTIONS['log-newtopic'] = function (el) {
  var root = logRoot(el);
  var sel = logField(root, 'course');
  var c = courseById(sel ? sel.value : LOGF.courseId);
  if (!c) { toast('Pick a course first'); return; }
  var row = el.parentNode;
  var box = document.createElement('span');
  box.className = 'row tight';
  box.innerHTML = '<input type="text" data-role="newtopic" placeholder="Topic name, Enter to add" style="max-width:210px">';
  row.replaceChild(box, el);
  var inp = box.querySelector('input');
  inp.focus();
  var commit = function (keep) {
    String(inp.value).split(',').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (t) {
      if (c.categories.indexOf(t) < 0) c.categories.push(t);
      if (LOGF.topics.indexOf(t) < 0) LOGF.topics.push(t);
    });
    dbSave(true);
    logField(root, 'topics').innerHTML = topicPickerHTML(c.id, LOGF.topics);
    if (keep) {
      var again = logField(root, 'topics').querySelector('[data-act="log-newtopic"]');
      if (again) ACTIONS['log-newtopic'](again);
    }
  };
  inp.onkeydown = function (e) {
    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); commit(true); }
    else if (e.key === 'Escape') { e.stopPropagation(); logField(root, 'topics').innerHTML = topicPickerHTML(c.id, LOGF.topics); }
  };
  inp.onblur = function () { commit(false); };
};

ACTIONS['log-save'] = function (el) {
  var root = logRoot(el);
  if (!root) { toast('Could not find the log form — reopen it and try again', 4000); return; }

  var sel = logField(root, 'course');
  var c = courseById(sel ? sel.value : null);
  if (!c) { toast('Pick a course first'); return; }

  /* a missing field is a bug, not a reason to invent a number */
  var count = logNum(root, 'count', 1);
  var mins = logNum(root, 'mins', DB.profile.sessionMinutes);
  if (count === null || mins === null) { toast('Could not read the form — reopen it and try again', 4000); return; }
  if (count <= 0 && mins <= 0) { toast('Nothing to log — add sessions or minutes'); return; }

  var dateEl = logField(root, 'date'), noteEl = logField(root, 'note');
  var date = (dateEl && dateEl.value) || today();
  var note = (noteEl && noteEl.value.trim()) || '';

  DB.sessions.push({
    id: uid(), courseId: c.id, date: date, count: count, minutes: mins,
    topics: LOGF.topics.slice(), note: note, createdAt: new Date().toISOString()
  });
  DB.lastCourseId = c.id;
  dbSave(true);

  var pr = progressOf(c);
  toast('Logged: ' + esc(c.name) + ' · ' + count + ' session' + (count === 1 ? '' : 's') + ' · ' + fmtMins(mins) +
        ' · ' + fmtMins(pr.minutes) + ' total' + (c.totalSessions ? ', ' + pr.remaining + ' left' : ''));
  if (c.totalSessions && pr.remaining === 0 && c.status === 'active') {
    setTimeout(function () { askCourseFinished(c.id); }, 400);
  }
  LOGF.topics = [];
  if ($('#modal-root').classList.contains('on')) modalClose();
  route();
};

/* --------------------------- session editing ---------------------------- */

function sessionById(id) {
  for (var i = 0; i < DB.sessions.length; i++) if (DB.sessions[i].id === id) return DB.sessions[i];
  return null;
}

ACTIONS['sess-edit'] = function (el) {
  var s = sessionById(el.getAttribute('data-id'));
  if (!s) return;
  var c = courseById(s.courseId);
  var cats = (c && c.categories) || [];
  modal(
    '<h2>Edit session</h2>' +
    '<div class="grid g2" style="gap:12px">' +
      '<div class="field"><label class="f">Course</label><select id="e-course">' + courseOptions(s.courseId) + '</select></div>' +
      '<div class="field"><label class="f">Date</label><input type="date" id="e-date" value="' + esc(s.date) + '"></div>' +
      '<div class="field"><label class="f">Sessions</label>' + stepper('e-count', num(s.count, 1), 1, 0, 99) + '</div>' +
      '<div class="field"><label class="f">Minutes</label>' + stepper('e-mins', num(s.minutes, 0), 5, 0, 1440) + '</div>' +
    '</div>' +
    '<div class="field"><label class="f">Topics</label><div class="chips" id="e-topics">' +
      cats.map(function (t) {
        return '<button class="chip' + ((s.topics || []).indexOf(t) >= 0 ? ' on' : '') + '" data-act="e-topic" data-topic="' + esc(t) + '">' + esc(t) + '</button>';
      }).join('') + '</div></div>' +
    '<div class="field"><label class="f">Note</label><input type="text" id="e-note" value="' + esc(s.note || '') + '"></div>' +
    '<div class="modal-foot">' +
      '<button class="btn danger" data-act="sess-del" data-id="' + s.id + '">Delete</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn" data-act="modal-close">Cancel</button>' +
      '<button class="btn primary" id="e-ok">Save</button>' +
    '</div>',
    function (box) {
      var picked = (s.topics || []).slice();
      ACTIONS['e-topic'] = function (b) {
        var t = b.getAttribute('data-topic'), i = picked.indexOf(t);
        if (i >= 0) picked.splice(i, 1); else picked.push(t);
        b.classList.toggle('on');
      };
      box.querySelector('#e-ok').onclick = function () {
        s.courseId = box.querySelector('#e-course').value;
        s.date = box.querySelector('#e-date').value || s.date;
        s.count = num(box.querySelector('[data-num="e-count"]').value, 1);
        s.minutes = num(box.querySelector('[data-num="e-mins"]').value, 0);
        s.note = box.querySelector('#e-note').value.trim();
        s.topics = picked;
        dbSave(true);
        modalClose();
        toast('Session updated — ' + fmtMins(s.minutes) + ' on ' + esc(courseName(s.courseId)));
        route();
      };
    }
  );
};

ACTIONS['sess-del'] = function (el) {
  var id = el.getAttribute('data-id');
  DB.sessions = DB.sessions.filter(function (s) { return s.id !== id; });
  dbSave(true);
  modalClose();
  toast('Session deleted');
  route();
};

function sessionRowsHTML(list, opts) {
  opts = opts || {};
  if (!list.length) return '<div class="empty">Nothing logged yet.</div>';
  return list.map(function (s) {
    var c = courseById(s.courseId);
    return '<div class="sess-row">' +
      '<span class="dot" style="background:' + (c ? courseColor(c.id) : '#888') + '"></span>' +
      '<div style="min-width:0;flex:1 1 auto">' +
        '<div style="font-weight:600">' + esc(c ? c.name : 'Deleted course') +
          (opts.showDate === false ? '' : ' <span class="mini">· ' + fmtShort(s.date) + '</span>') + '</div>' +
        '<div class="mini">' + num(s.count, 0) + ' session' + (num(s.count, 0) === 1 ? '' : 's') + ' · ' + fmtMins(s.minutes) +
          ((s.topics && s.topics.length) ? ' · ' + s.topics.map(esc).join(', ') : '') +
          (s.note ? ' · ' + esc(s.note) : '') + '</div>' +
      '</div>' +
      '<button class="btn sm ghost" data-act="sess-edit" data-id="' + s.id + '">Edit</button>' +
    '</div>';
  }).join('');
}

/* ===== 20-dashboard.js ===== */
/* =============================================================================
   20-dashboard — today at a glance: the readings, then the same readings drawn.
   Charts come from 05-charts.js; this file only decides what to plot.
   ========================================================================== */

function goalRingHTML(mins, goal, size) {
  size = size || 82;
  var r = size / 2 - 6, cx = size / 2, cy = size / 2;
  var frac = goal > 0 ? clamp(mins / goal, 0, 1) : 0;
  var circ = 2 * Math.PI * r;
  return '<svg class="ring" width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="font-family:inherit">' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--rule)" stroke-width="5" stroke-dasharray="2 3"/>' +
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--accent)" stroke-width="5" ' +
      'stroke-dasharray="' + circ.toFixed(1) + '" stroke-dashoffset="' + (circ * (1 - frac)).toFixed(1) + '" ' +
      'transform="rotate(-90 ' + cx + ' ' + cy + ')"/>' +
    '<text x="' + cx + '" y="' + (cy + 5) + '" text-anchor="middle" fill="var(--ink)" font-size="15" font-weight="600">' +
      Math.round(frac * 100) + '%</text>' +
    '</svg>';
}

function miniStripHTML(days) {
  days = days || 30;
  var m = byDayMap(), max = 0, out = '';
  var list = [];
  for (var i = days - 1; i >= 0; i--) {
    var d = shiftDays(today(), -i), v = m[d] ? m[d].minutes : 0;
    list.push([d, v]);
    if (v > max) max = v;
  }
  list.forEach(function (p) {
    var lvl = p[1] === 0 ? 0 : clamp(Math.ceil(p[1] / (max || 1) * 4), 1, 4);
    out += '<div class="c" data-l="' + lvl + '" title="' + fmtDate(p[0]) + ' — ' + fmtMins(p[1]) + '"></div>';
  });
  return '<div class="heat" style="flex-wrap:wrap;gap:3px">' + out + '</div>';
}

function deadlineAlerts() {
  var out = [];
  DB.courses.forEach(function (c) {
    if (c.status !== 'active' || !c.deadline) return;
    var dl = daysLeft(c);
    if (dl <= 7) out.push({ course: c, dl: dl });
  });
  return out.sort(function (a, b) { return a.dl - b.dl; });
}

function renderDashboard(v) {
  var t = today();
  var todayList = DB.sessions.filter(function (s) { return s.date === t; });
  var weekList = sessionsInRange(shiftDays(t, -6), t);
  var monthList = sessionsInRange(shiftDays(t, -29), t);
  var st = streaks();
  var goal = DB.profile.dailyGoalMin || 0;
  var totalMins = sumMins(DB.sessions);
  var alerts = deadlineAlerts();
  var hour = new Date().getHours();
  var greet = hour < 5 ? 'Still up' : hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';

  var html = '';
  html += '<h1>' + greet + (DB.profile.name ? ', ' + esc(DB.profile.name) : '') + '</h1>';
  html += '<p class="sub">' + fmtDate(t) + ' · ' + activeCourses().length + ' active course' +
          (activeCourses().length === 1 ? '' : 's') + '</p>';

  /* deadline nudges */
  if (alerts.length) {
    html += '<div class="card" style="border-left:3px solid var(--warn);margin-bottom:16px">';
    html += '<h3 style="color:var(--warn)">Deadlines</h3>';
    alerts.forEach(function (a) {
      var over = a.dl < 0;
      html += '<div class="row" style="padding:7px 0;border-bottom:1px dashed var(--rule)">' +
        '<b>' + esc(a.course.name) + '</b>' +
        '<span class="pill ' + (over ? 'bad' : 'warn') + '">' +
          (over ? Math.abs(a.dl) + ' day' + (Math.abs(a.dl) === 1 ? '' : 's') + ' overdue' :
           a.dl === 0 ? 'due today' : a.dl + ' day' + (a.dl === 1 ? '' : 's') + ' left') + '</span>' +
        '<span class="mini">' + progressOf(a.course).remaining + ' sessions remaining</span>' +
        '<span class="spacer"></span>' +
        '<button class="btn sm" data-act="course-deadline-decide" data-id="' + a.course.id + '">Decide</button>' +
      '</div>';
    });
    html += '</div>';
  }

  /* the readings */
  html += '<div class="grid g4">';
  html += '<div class="card row span2" style="gap:14px">' + goalRingHTML(sumMins(todayList), goal) +
    '<div class="kpi"><span class="k">Today</span><span class="v">' + fmtMins(sumMins(todayList)) + '</span>' +
    '<span class="n">' + sumCount(todayList) + ' sessions' + (goal ? ' · goal ' + fmtMins(goal) : '') + '</span></div></div>';
  html += '<div class="card kpi"><span class="k">Last 7 days</span><span class="v">' + fmtMins(sumMins(weekList)) + '</span>' +
    '<span class="n">' + sumCount(weekList) + ' sessions · ' + Math.round(sumMins(weekList) / 7) + 'm/day</span></div>';
  html += '<div class="card kpi"><span class="k">Streak</span><span class="v">' + st.current +
    ' <span style="font-size:15px;font-weight:400;color:var(--ink-3)">' + (st.current === 1 ? 'day' : 'days') + '</span></span>' +
    '<span class="n">longest ' + st.longest + ' · ' + st.activeDays + ' days logged</span></div>';
  html += '<div class="card kpi"><span class="k">All time</span><span class="v">' + fmtMins(totalMins) + '</span>' +
    '<span class="n">' + sumCount(DB.sessions) + ' sessions logged</span></div>';
  html += '</div>';

  /* the same readings, drawn */
  if (DB.sessions.length) {
    var dayMap = byDayMap();
    var narrow = isNarrow();
    var d14 = [];
    for (var i = (narrow ? 6 : 13); i >= 0; i--) {
      var ds = shiftDays(t, -i);
      d14.push({ label: fmtShort(ds), v: dayMap[ds] ? dayMap[ds].minutes : 0 });
    }
    var courseSlices = timeByCourse(monthList.length ? monthList : DB.sessions, 6);
    var wk = [];
    for (var w = 7; w >= 0; w--) {
      var end = shiftDays(t, -w * 7), start = shiftDays(end, -6);
      wk.push({ label: fmtShort(start), v: sumMins(sessionsInRange(start, end)) });
    }

    html += '<div class="sechead"><h2>' + (narrow ? 'The last week' : 'The last two weeks') + '</h2>' +
      '<span class="mini">minutes per day</span></div>';
    html += '<div class="card">' + barsSVG(d14, { fmt: fmtMins, h: narrow ? 120 : 150, w: narrow ? 360 : 720 }) + '</div>';

    html += '<div class="sechead"><h2>Balance and trend</h2>' +
      '<span class="mini">share by course · minutes per week</span>' +
      '<span class="spacer"></span><a class="mini" href="#/stats">Full statistics</a></div>';
    html += '<div class="split charts">';
    html += '<div class="card"><h3>Time by course</h3>' +
      donutSVG(courseSlices, { fmt: fmtMins, centreNote: monthList.length ? 'last 30 days' : 'all time', size: narrow ? 190 : 205 }) +
      legendHTML(courseSlices, { fmt: fmtMins }) + '</div>';
    html += '<div class="card"><h3>Weekly trend</h3>' + lineSVG(wk, { fmt: fmtMins, h: narrow ? 130 : 165, w: narrow ? 360 : 720 }) +
      '<div class="hint">Each point is one week of tracked minutes.</div></div>';
    html += '</div>';
  }

  /* log + today */
  html += '<div class="sechead"><h2>Log today</h2><span class="spacer"></span>' +
    '<a class="mini" href="#/calendar">Open calendar</a></div>';
  html += '<div class="split log">';
  html += logCardHTML();
  html += '<div class="card"><h3>Today</h3>' +
    sessionRowsHTML(todayList.slice().reverse(), { showDate: false }) +
    '<h3 style="margin-top:18px">Last 30 days</h3>' + miniStripHTML(30) + '</div>';
  html += '</div>';

  /* course progress */
  var act = activeCourses().slice().sort(function (a, b) {
    var da = a.deadline ? daysLeft(a) : 9999, db2 = b.deadline ? daysLeft(b) : 9999;
    return da - db2;
  });
  html += '<div class="sechead"><h2>Course progress</h2><span class="spacer"></span>' +
          '<a class="mini" href="#/classroom">Manage courses</a></div>';
  if (!act.length) {
    html += '<div class="empty">No active courses. <a href="#/classroom">Add one</a></div>';
  } else {
    html += '<div class="grid g2">';
    act.forEach(function (c) {
      var p = progressOf(c), dl = daysLeft(c), pace = paceNeeded(c);
      html += '<div class="card course-card">' +
        '<div class="cardhead"><span class="dot" style="background:' + courseColor(c.id) + '"></span>' +
          '<span class="ttl">' + esc(c.name) + '</span>' +
          '<span class="mini">' + (c.totalSessions ? p.done + '/' + c.totalSessions : p.done + ' done') + '</span></div>' +
        '<div class="bar"><i style="width:' + p.pct + '%"></i></div>' +
        '<div class="row tight mini">' +
          '<span>' + fmtMins(p.minutes) + ' logged</span>' +
          (c.totalSessions ? '<span>· ' + p.remaining + ' left</span>' : '') +
          (dl !== null ? '<span class="pill ' + (dl < 0 ? 'bad' : dl <= 7 ? 'warn' : '') + '">Due ' + fmtShortY(c.deadline) +
            ' (' + (dl < 0 ? Math.abs(dl) + 'd over' : dl + 'd') + ')</span>' : '') +
          (pace && pace !== Infinity ? '<span class="pill">' + pace.toFixed(1) + ' sess/day needed</span>' : '') +
        '</div>' +
        (c.link ? '<div class="linkline"><a href="' + esc(c.link) + '" target="_blank" rel="noopener">Open course</a></div>' : '') +
      '</div>';
    });
    html += '</div>';
  }

  v.innerHTML = html;
  wireLog();
}

/* ===== 30-classroom.js ===== */
/* =============================================================================
   30-classroom — courses: add/edit/remove, topics, links, deadline decisions.

   Deadlines are always optional. When one arrives (or the session target is
   met) the app asks the one question that matters: done, extend, or drop?
   ========================================================================== */

function renderClassroom(v) {
  var groups = [
    ['Active', DB.courses.filter(function (c) { return c.status === 'active'; })],
    ['Completed', DB.courses.filter(function (c) { return c.status === 'completed'; })],
    ['Dropped', DB.courses.filter(function (c) { return c.status === 'dropped'; })]
  ];

  var html = '<div class="row"><div><h1>Classroom</h1>' +
    '<p class="sub">Every course you are taking, with its class link, topics and deadline.</p></div>' +
    '<span class="spacer"></span>' +
    '<button class="btn primary" data-act="course-add">Add course</button>' +
    '<button class="btn" data-act="csv-import-open">Import CSV</button></div>';

  if (!DB.courses.length) {
    html += '<div class="empty">No courses yet.<br><br>' +
      '<button class="btn primary" data-act="course-add">Add your first course</button> ' +
      '<button class="btn" data-act="seed-starter">Use the starter list</button></div>';
  }

  groups.forEach(function (g) {
    if (!g[1].length) return;
    html += '<div class="sechead"><h2>' + g[0] + '</h2><span class="pill">' + g[1].length + '</span></div>';
    html += '<div class="grid g2">';
    g[1].forEach(function (c) { html += courseCardHTML(c); });
    html += '</div>';
  });

  v.innerHTML = html;
}

function courseCardHTML(c) {
  var p = progressOf(c), dl = daysLeft(c);
  var res = DB.resources.filter(function (r) { return r.courseId === c.id; }).length;
  var nb = DB.notebooks.filter(function (n) { return n.courseId === c.id; }).length;
  var h = '<div class="card course-card ' + (c.status === 'completed' ? 'done' : c.status === 'dropped' ? 'dropped' : '') + '">';
  h += '<div class="cardhead"><span class="dot" style="background:' + courseColor(c.id) + '"></span>' +
    '<span class="ttl" title="' + esc(c.name) + '">' + esc(c.name) + '</span>' +
    (c.status === 'completed' ? '<span class="tag" style="background:var(--ok-soft);color:var(--ok)">completed</span>' : '') +
    (c.status === 'dropped' ? '<span class="tag">dropped</span>' : '') + '</div>';

  h += '<div class="bar"><i style="width:' + p.pct + '%"></i></div>';
  h += '<div class="row tight mini">' +
    '<span><b>' + p.done + '</b>' + (c.totalSessions ? ' / ' + c.totalSessions : '') + ' sessions</span>' +
    (c.totalSessions ? '<span>· ' + p.remaining + ' remaining</span>' : '') +
    '<span>· ' + fmtMins(p.minutes) + ' tracked</span>' +
    (p.last ? '<span>· last ' + fmtShort(p.last) + '</span>' : '') +
    '</div>';

  h += '<div class="row tight">';
  h += dl !== null
    ? '<span class="pill ' + (dl < 0 ? 'bad' : dl <= 7 ? 'warn' : '') + '">Due ' + fmtDate(c.deadline) + ' · ' +
      (dl < 0 ? Math.abs(dl) + 'd over' : dl + 'd left') + '</span>' +
      '<button class="btn sm ghost" data-act="course-deadline-decide" data-id="' + c.id + '">Change</button>'
    : '<button class="btn sm ghost" data-act="course-deadline-set" data-id="' + c.id + '">Set a deadline</button>';
  h += '</div>';

  if (c.categories && c.categories.length) {
    h += '<div class="chips">' + c.categories.map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('') + '</div>';
  } else {
    h += '<button class="btn sm ghost" data-act="course-topics" data-id="' + c.id + '">Add topics — they feed the brain map</button>';
  }

  var links = [];
  if (c.link) links.push('<a href="' + esc(c.link) + '" target="_blank" rel="noopener">Class / playlist</a>');
  (c.extraLinks || []).forEach(function (l) {
    links.push('<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label || 'Link') + '</a>');
  });
  links.push('<a href="#/resources?course=' + c.id + '">Resources (' + res + ')</a>');
  links.push('<a href="#/notebooks?course=' + c.id + '">Notebooks (' + nb + ')</a>');
  links.push('<a href="#" data-act="course-edit" data-id="' + c.id + '">Edit</a>');
  links.push('<a href="#" data-act="course-del" data-id="' + c.id + '">Remove</a>');
  h += '<div class="linkline">' + links.join('') + '</div>';

  if (c.notes) h += '<div class="mini">' + esc(c.notes) + '</div>';
  if (c.extensions && c.extensions.length) {
    h += '<div class="mini">Extended ' + c.extensions.length + '× (was ' + fmtShortY(c.extensions[0].from) + ')</div>';
  }

  h += '<div class="row tight">';
  if (c.status === 'active') {
    h += '<button class="btn sm" data-act="course-complete" data-id="' + c.id + '">Mark completed</button>' +
         '<button class="btn sm ghost" data-act="course-drop" data-id="' + c.id + '">Drop</button>';
  } else {
    h += '<button class="btn sm" data-act="course-reopen" data-id="' + c.id + '">Reopen</button>';
  }
  h += '</div></div>';
  return h;
}

/* ------------------------------- add / edit ------------------------------ */

function courseFormModal(course) {
  var isNew = !course;
  var c = course || newCourse({});
  var picked = (c.categories || []).slice();
  var hints = topicHints(c.name).filter(function (t) { return picked.indexOf(t) < 0; });

  modal(
    '<h2>' + (isNew ? 'Add a course' : 'Edit course') + '</h2>' +
    '<div class="field"><label class="f">Course name *</label>' +
      '<input type="text" id="c-name" value="' + esc(c.name === 'Untitled course' ? '' : c.name) + '" placeholder="e.g. Statistics"></div>' +
    '<div class="field"><label class="f">Class / playlist link</label>' +
      '<input type="url" id="c-link" value="' + esc(c.link) + '" placeholder="https://youtube.com/playlist?list=… or your LMS URL"></div>' +
    '<div class="grid g2" style="gap:12px">' +
      '<div class="field"><label class="f">Total sessions / lectures in the course</label>' + stepper('c-total', c.totalSessions, 1, 0, 9999) +
        '<div class="hint">0 = untracked, just log time.</div></div>' +
      '<div class="field"><label class="f">Already finished before today</label>' + stepper('c-off', c.doneOffset, 1, 0, 9999) +
        '<div class="hint">Head start, so progress starts where you actually are.</div></div>' +
    '</div>' +
    '<div class="field"><label class="f">Deadline (optional)</label>' +
      '<div class="row tight"><input type="date" id="c-dl" value="' + esc(c.deadline) + '" style="max-width:200px">' +
      '<button class="btn sm" data-act="c-dl-quick" data-d="30">+30d</button>' +
      '<button class="btn sm" data-act="c-dl-quick" data-d="60">+60d</button>' +
      '<button class="btn sm" data-act="c-dl-quick" data-d="90">+90d</button>' +
      '<button class="btn sm" data-act="c-dl-quick" data-d="">none</button></div>' +
      '<div class="hint">When the date arrives the app asks: completed, extend, or drop?</div></div>' +
    '<div class="field"><label class="f">Topics / categories</label>' +
      '<div class="chips" id="c-cats"></div>' +
      '<div class="row tight" style="margin-top:8px"><input type="text" id="c-newcat" placeholder="Add topic and press Enter" style="max-width:260px">' +
      '<span class="mini">used by the brain map</span></div>' +
      '<div class="chips" id="c-hints" style="margin-top:8px">' + hints.map(function (t) {
        return '<button class="chip" data-act="c-hint" data-t="' + esc(t) + '">' + esc(t) + '</button>';
      }).join('') + '</div></div>' +
    '<div class="field"><label class="f">Notes</label><input type="text" id="c-notes" value="' + esc(c.notes || '') + '" placeholder="exam date, syllabus notes…"></div>' +
    '<div class="modal-foot"><button class="btn" data-act="modal-close">Cancel</button>' +
      '<button class="btn primary" id="c-ok">' + (isNew ? 'Add course' : 'Save') + '</button></div>',
    function (box) {
      function drawCats() {
        box.querySelector('#c-cats').innerHTML = picked.length
          ? picked.map(function (t) { return '<button class="chip on" data-act="c-uncat" data-t="' + esc(t) + '">' + esc(t) + '<span class="x">×</span></button>'; }).join('')
          : '<span class="mini">none yet</span>';
      }
      ACTIONS['c-uncat'] = function (b) { picked = picked.filter(function (t) { return t !== b.getAttribute('data-t'); }); drawCats(); };
      ACTIONS['c-hint'] = function (b) { var t = b.getAttribute('data-t'); if (picked.indexOf(t) < 0) picked.push(t); b.remove(); drawCats(); };
      ACTIONS['c-dl-quick'] = function (b) {
        var d = b.getAttribute('data-d');
        box.querySelector('#c-dl').value = d ? shiftDays(today(), +d) : '';
      };
      drawCats();
      var nc = box.querySelector('#c-newcat');
      nc.onkeydown = function (e) {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        String(nc.value).split(',').map(function (s) { return s.trim(); }).filter(Boolean).forEach(function (t) {
          if (picked.indexOf(t) < 0) picked.push(t);
        });
        nc.value = '';
        drawCats();
      };
      box.querySelector('#c-ok').onclick = function () {
        var name = box.querySelector('#c-name').value.trim();
        if (!name) { toast('Give the course a name'); return; }
        c.name = name;
        c.link = box.querySelector('#c-link').value.trim();
        c.totalSessions = readNum('c-total', 0);
        c.doneOffset = readNum('c-off', 0);
        c.deadline = box.querySelector('#c-dl').value || '';
        c.notes = box.querySelector('#c-notes').value.trim();
        c.categories = picked;
        if (isNew) DB.courses.push(c);
        dbSave(true);
        modalClose();
        toast(isNew ? esc(name) + ' added' : 'Course saved');
        route();
      };
    }
  );
}

ACTIONS['course-add'] = function () { courseFormModal(null); };
ACTIONS['course-edit'] = function (el) { courseFormModal(courseById(el.getAttribute('data-id'))); };

ACTIONS['course-topics'] = function (el) { courseFormModal(courseById(el.getAttribute('data-id'))); };

ACTIONS['course-del'] = function (el) {
  var c = courseById(el.getAttribute('data-id'));
  if (!c) return;
  var n = DB.sessions.filter(function (s) { return s.courseId === c.id; }).length;
  confirmBox('Remove ' + c.name + '?',
    n ? 'This also deletes <b>' + n + ' logged session' + (n === 1 ? '' : 's') + '</b>. ' +
        'If you only want it out of the way, drop the course instead — the history stays.'
      : 'Nothing has been logged against it.',
    'Remove course', function () {
      DB.courses = DB.courses.filter(function (x) { return x.id !== c.id; });
      DB.sessions = DB.sessions.filter(function (s) { return s.courseId !== c.id; });
      DB.resources.forEach(function (r) { if (r.courseId === c.id) r.courseId = ''; });
      DB.notebooks.forEach(function (nb) { if (nb.courseId === c.id) nb.courseId = ''; });
      dbSave(true); toast('Removed'); route();
    });
};

ACTIONS['course-complete'] = function (el) {
  var c = courseById(el.getAttribute('data-id'));
  c.status = 'completed';
  c.completedAt = today();
  dbSave(true); toast(esc(c.name) + ' marked completed'); route();
};
ACTIONS['course-drop'] = function (el) {
  var c = courseById(el.getAttribute('data-id'));
  c.status = 'dropped';
  dbSave(true); toast(esc(c.name) + ' dropped — history kept'); route();
};
ACTIONS['course-reopen'] = function (el) {
  var c = courseById(el.getAttribute('data-id'));
  c.status = 'active';
  delete c.completedAt;
  dbSave(true); toast(esc(c.name) + ' is active again'); route();
};

/* ---------------------------- deadline dialogs --------------------------- */

ACTIONS['course-deadline-set'] = function (el) {
  var c = courseById(el.getAttribute('data-id'));
  var p = progressOf(c);
  modal(
    '<h2>Set a deadline for ' + esc(c.name) + '</h2>' +
    '<p class="sub">Optional — but with one, the app can tell you the pace you need.' +
      (c.totalSessions ? ' ' + p.remaining + ' sessions remain.' : '') + '</p>' +
    '<div class="field"><label class="f">Finish by</label><input type="date" id="d-date" value="' + shiftDays(today(), 30) + '" min="' + today() + '"></div>' +
    '<div class="chips">' + [14, 30, 60, 90, 180].map(function (n) {
      return '<button class="chip" data-act="d-quick" data-d="' + n + '">' + n + ' days</button>';
    }).join('') + '</div>' +
    '<div class="hint" id="d-pace" style="margin-top:10px"></div>' +
    '<div class="modal-foot"><button class="btn" data-act="modal-close">Skip for now</button>' +
      '<button class="btn primary" id="d-ok">Set deadline</button></div>',
    function (box) {
      var inp = box.querySelector('#d-date');
      function pace() {
        var d = daysBetween(today(), inp.value);
        box.querySelector('#d-pace').innerHTML = (c.totalSessions && d > 0)
          ? 'That is <b>' + (p.remaining / d).toFixed(1) + '</b> sessions/day for ' + d + ' days.'
          : '';
      }
      ACTIONS['d-quick'] = function (b) { inp.value = shiftDays(today(), +b.getAttribute('data-d')); pace(); };
      inp.oninput = pace; pace();
      box.querySelector('#d-ok').onclick = function () {
        c.deadline = inp.value; dbSave(true); modalClose(); toast('Deadline set'); route();
      };
    }
  );
};

/* the "your deadline is here" decision: complete / extend / drop */
ACTIONS['course-deadline-decide'] = function (el) { deadlineDecide(el.getAttribute('data-id')); };

function deadlineDecide(id) {
  var c = courseById(id);
  if (!c) return;
  var p = progressOf(c), dl = daysLeft(c);
  modal(
    '<h2>' + esc(c.name) + '</h2>' +
    '<p class="sub">Deadline ' + fmtDate(c.deadline) + ' — ' +
      (dl < 0 ? '<b>' + Math.abs(dl) + ' day(s) overdue</b>' : dl === 0 ? '<b>today</b>' : dl + ' days left') + '. ' +
