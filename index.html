/* ===== 40-calendar.js ===== */
/* =============================================================================
   40-calendar — month grid, day detail, year heatmap, month-by-month summary.
   This is the "did I actually show up?" page, over days, months and years.
   ========================================================================== */

var CAL = { month: today().slice(0, 7), sel: today(), year: today().slice(0, 4), courseId: '' };

function calFiltered() {
  return CAL.courseId ? DB.sessions.filter(function (s) { return s.courseId === CAL.courseId; }) : DB.sessions;
}

function calDayMap(list) {
  var m = {};
  list.forEach(function (s) {
    if (!m[s.date]) m[s.date] = { count: 0, minutes: 0, courses: {} };
    m[s.date].count += num(s.count, 0);
    m[s.date].minutes += num(s.minutes, 0);
    m[s.date].courses[s.courseId] = true;
  });
  return m;
}

function monthGridHTML(mk, dayMap) {
  var y = +mk.slice(0, 4), mo = +mk.slice(5, 7) - 1;
  var first = new Date(y, mo, 1), dim = new Date(y, mo + 1, 0).getDate();
  var startPad = first.getDay();                     // week starts Sunday
  var max = 0;
  Object.keys(dayMap).forEach(function (d) { if (d.slice(0, 7) === mk && dayMap[d].minutes > max) max = dayMap[d].minutes; });

  var h = '<div class="cal">' + DOW.map(function (d) { return '<div class="dow">' + d + '</div>'; }).join('');
  for (var i = 0; i < startPad; i++) h += '<div class="day pad"></div>';
  for (var d = 1; d <= dim; d++) {
    var ds = y + '-' + pad2(mo + 1) + '-' + pad2(d);
    var e = dayMap[ds];
    var lvl = !e ? 0 : clamp(Math.ceil(e.minutes / (max || 1) * 4), 1, 4);
    var dots = e ? Object.keys(e.courses).map(function (cid) {
      return '<span style="display:inline-block;width:6px;height:6px;border-radius:1px;background:' + courseColor(cid) + '"></span>';
    }).join('') : '';
    h += '<div class="day' + (ds === today() ? ' today' : '') + (ds === CAL.sel ? ' sel' : '') +
      (lvl >= 3 ? ' deep' : '') + '" ' +
      'data-act="cal-day" data-d="' + ds + '" ' +
      'style="background:' + (lvl ? 'color-mix(in srgb, var(--accent) ' + (lvl * 15) + '%, var(--surface))' : 'var(--surface)') + '">' +
      '<div class="d">' + d + '</div>' +
      (e ? '<div class="m">' + fmtMinsTight(e.minutes) + '</div><div class="row tight" style="gap:3px">' + dots + '</div>' : '') +
      '</div>';
  }
  h += '</div>';
  return h;
}

function yearHeatHTML(year, dayMap) {
  var start = new Date(+year, 0, 1), end = new Date(+year, 11, 31);
  // back up to the Sunday on/just before Jan 1
  var cur = new Date(start);
  cur.setDate(cur.getDate() - cur.getDay());
  var max = 0;
  Object.keys(dayMap).forEach(function (d) { if (d.slice(0, 4) === year && dayMap[d].minutes > max) max = dayMap[d].minutes; });

  var h = '<div class="heat">';
  while (cur <= end) {
    h += '<div class="wk">';
    for (var i = 0; i < 7; i++) {
      var ds = iso(cur), inYear = ds.slice(0, 4) === year;
      var e = inYear ? dayMap[ds] : null;
      var lvl = !e ? 0 : clamp(Math.ceil(e.minutes / (max || 1) * 4), 1, 4);
      h += '<div class="c" data-l="' + lvl + '"' + (inYear ? ' title="' + fmtDate(ds) + ' — ' + (e ? fmtMins(e.minutes) + ', ' + e.count + ' sessions' : 'nothing') + '"' : ' style="opacity:.25"') + '></div>';
      cur.setDate(cur.getDate() + 1);
    }
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function renderCalendar(v) {
  var list = calFiltered();
  var dayMap = calDayMap(list);
  var mk = CAL.month;
  var monthList = list.filter(function (s) { return monthKey(s.date) === mk; });
  var selList = list.filter(function (s) { return s.date === CAL.sel; });
  var years = {};
  DB.sessions.forEach(function (s) { years[s.date.slice(0, 4)] = 1; });
  years[today().slice(0, 4)] = 1;

  var h = '<div class="row"><div><h1>Log &amp; Calendar</h1>' +
    '<p class="sub">Click any day to see or add sessions. Colour = minutes studied.</p></div>' +
    '<span class="spacer"></span>' +
    '<select id="cal-course" class="filter">' + courseOptions(CAL.courseId, true) + '</select></div>';

  /* month nav + grid + day detail */
  h += '<div class="split cal">';
  h += '<div class="card">' +
    '<div class="row" style="margin-bottom:10px">' +
      '<button class="btn sm" data-act="cal-prev">‹</button>' +
      '<h2 style="margin:0;min-width:150px;text-align:center">' + fmtMonth(mk) + '</h2>' +
      '<button class="btn sm" data-act="cal-next">›</button>' +
      '<button class="btn sm ghost" data-act="cal-today">Today</button>' +
      '<span class="spacer"></span>' +
      '<span class="pill"><b>' + fmtMins(sumMins(monthList)) + '</b> this month</span>' +
      '<span class="pill"><b>' + sumCount(monthList) + '</b> sessions</span>' +
    '</div>' + monthGridHTML(mk, dayMap) + '</div>';

  h += '<div class="card">' +
    '<div class="row" style="margin-bottom:8px"><h2 style="margin:0">' + fmtDate(CAL.sel) + '</h2></div>' +
    '<div class="row tight mini" style="margin-bottom:10px">' +
      '<span class="pill"><b>' + fmtMins(sumMins(selList)) + '</b></span>' +
      '<span class="pill"><b>' + sumCount(selList) + '</b> sessions</span></div>' +
    sessionRowsHTML(selList, { showDate: false }) +
    '<div class="row" style="margin-top:12px"><button class="btn primary" data-act="cal-add" data-d="' + CAL.sel + '">Log on this day</button></div>' +
    '</div>';
  h += '</div>';

  /* year heatmap */
  h += '<div class="sechead"><h2>Year view</h2>' +
    '<select id="cal-year" class="filter narrow">' + Object.keys(years).sort().reverse().map(function (y) {
      return '<option' + (y === CAL.year ? ' selected' : '') + '>' + y + '</option>';
    }).join('') + '</select></div>';
  var yList = list.filter(function (s) { return s.date.slice(0, 4) === CAL.year; });
  h += '<div class="card"><div class="row tight mini" style="margin-bottom:10px">' +
    '<span class="pill"><b>' + fmtMins(sumMins(yList)) + '</b> in ' + CAL.year + '</span>' +
    '<span class="pill"><b>' + sumCount(yList) + '</b> sessions</span>' +
    '<span class="pill"><b>' + Object.keys(calDayMap(yList)).length + '</b> active days</span>' +
    '</div>' + yearHeatHTML(CAL.year, dayMap) + '</div>';

  /* month-by-month summary */
  h += '<div class="sechead"><h2>Every month you have studied</h2></div>';
  var months = monthlySummary();
  if (!months.length) {
    h += '<div class="empty">Log your first session and this table starts filling up.</div>';
  } else {
    h += '<div class="card scroll-x"><table><thead><tr>' +
      '<th>Month</th><th class="num">Sessions</th><th class="num">Time</th><th class="num">Active days</th>' +
      '<th class="num">Avg / active day</th><th>Most studied</th></tr></thead><tbody>';
    months.forEach(function (m) {
      h += '<tr><td><a href="#" data-act="cal-goto" data-m="' + m.key + '">' + fmtMonth(m.key) + '</a></td>' +
        '<td class="num">' + m.count + '</td>' +
        '<td class="num">' + fmtMins(m.minutes) + '</td>' +
        '<td class="num">' + m.activeDays + '</td>' +
        '<td class="num">' + fmtMins(m.minutes / (m.activeDays || 1)) + '</td>' +
        '<td><span class="row tight"><span style="display:inline-block;width:8px;height:8px;border-radius:1px;background:' +
          courseColor(m.topCourse) + '"></span>' + esc(courseName(m.topCourse)) + '</span></td></tr>';
    });
    h += '</tbody></table></div>';
  }

  v.innerHTML = h;
  var cs = $('#cal-course');
  if (cs) cs.onchange = function () { CAL.courseId = cs.value; route(); };
  var ys = $('#cal-year');
  if (ys) ys.onchange = function () { CAL.year = ys.value; route(); };
}

function monthShift(mk, n) {
  var y = +mk.slice(0, 4), m = +mk.slice(5, 7) - 1 + n;
  var d = new Date(y, m, 1);
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
}

/* =============================================================================
   50-resources — books, PDFs, playlists, folders. Anywhere: web, OneDrive,
   Google Drive, or a path on this machine.
   ========================================================================== */

var RES = { q: '', courseId: '', type: '', status: '' };

/* a local path (or file://) needs different handling from a normal URL */
function isLocalPath(u) {
  return /^file:\/\//i.test(u) || /^[a-zA-Z]:\\/.test(u) || /^[~/]/.test(u);
}
function asHref(u) {
  if (!u) return '';
  if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u)) return u;          // already has a scheme
  if (/^[~/]/.test(u)) return 'file://' + u.replace(/^~/, '');
  if (/^[a-zA-Z]:\\/.test(u)) return 'file:///' + u.replace(/\\/g, '/');
  return 'https://' + u;
}
function hostOf(u) {
  try { return new URL(asHref(u)).hostname.replace(/^www\./, ''); } catch (e) { return ''; }
}
function guessType(u) {
  var s = String(u).toLowerCase();
  if (/\.pdf($|\?)/.test(s)) return 'pdf';
  if (/\.epub|\.mobi|\.azw/.test(s)) return 'book';
  if (/youtube|youtu\.be|vimeo/.test(s)) return 'video';
  if (/\.xlsx?|\.csv|sheets\.google/.test(s)) return 'sheet';
  if (/sharepoint|onedrive|drive\.google|dropbox|1drv\.ms/.test(s)) return 'folder';
  if (isLocalPath(u)) return 'folder';
  return 'site';
}

function renderResources(v) {
  var q = RES.q.toLowerCase();
  var list = DB.resources.filter(function (r) {
    if (RES.courseId && r.courseId !== RES.courseId) return false;
    if (RES.type && r.type !== RES.type) return false;
    if (RES.status && r.status !== RES.status) return false;
    if (q && (r.title + ' ' + (r.url || '') + ' ' + (r.notes || '')).toLowerCase().indexOf(q) < 0) return false;
    return true;
  });

  var h = '<div class="row"><div><h1>Resources</h1>' +
    '<p class="sub">Books, PDFs, playlists and folders — on the web, in OneDrive/Drive, or on this machine.</p></div>' +
    '<span class="spacer"></span><button class="btn primary" data-act="res-add">Add resource</button></div>';

  h += '<div class="card" style="margin-bottom:14px"><div class="row">' +
    '<input type="text" id="res-q" class="filter" placeholder="Search title, link, notes…" value="' + esc(RES.q) + '">' +
    '<select id="res-course" class="filter">' + courseOptions(RES.courseId, true) + '</select>' +
    '<select id="res-type" class="filter"><option value="">All types</option>' +
      Object.keys(RES_TYPES).map(function (k) {
        return '<option value="' + k + '"' + (RES.type === k ? ' selected' : '') + '>' + RES_TYPES[k].label + '</option>';
      }).join('') + '</select>' +
    '<select id="res-status" class="filter">' +
      ['', 'todo', 'reading', 'done'].map(function (s) {
        return '<option value="' + s + '"' + (RES.status === s ? ' selected' : '') + '>' +
          (s === '' ? 'Any status' : s === 'todo' ? 'To read' : s === 'reading' ? 'In progress' : 'Finished') + '</option>';
      }).join('') + '</select>' +
    '<span class="spacer"></span><span class="pill"><b>' + list.length + '</b> of ' + DB.resources.length + '</span>' +
    '</div></div>';

  if (!DB.resources.length) {
    h += '<div class="empty">Nothing here yet.<br><br><button class="btn primary" data-act="res-add">Add the first resource</button></div>';
  } else if (!list.length) {
    h += '<div class="empty">Nothing matches that filter.</div>';
  } else {
    h += '<div class="grid g2">';
    list.forEach(function (r) {
      var t = RES_TYPES[r.type] || RES_TYPES.other;
      var local = isLocalPath(r.url || '');
      h += '<div class="card course-card">' +
        '<div class="ttl">' + esc(r.title) + '</div>' +
        '<div class="row tight">' +
          '<span class="tag">' + t.label + '</span>' +
          (r.courseId ? '<span class="tag"><span style="width:6px;height:6px;border-radius:1px;background:' + courseColor(r.courseId) + '"></span>' + esc(courseName(r.courseId)) + '</span>' : '') +
          '<span class="tag">' + (r.status === 'done' ? 'finished' : r.status === 'reading' ? 'in progress' : 'to read') + '</span>' +
        '</div>' +
        '<div class="mini">' +
          (local ? 'On this machine' : (hostOf(r.url) ? esc(hostOf(r.url)) : 'No link')) +
          (r.notes ? ' · ' + esc(r.notes) : '') + '</div>' +
        '<div class="linkline">' +
          (r.url ? '<a href="' + esc(asHref(r.url)) + '" target="_blank" rel="noopener">Open</a>' : '') +
          (r.url && local ? '<a href="#" data-act="copy" data-v="' + esc(r.url) + '">Copy path</a>' : '') +
          '<a href="#" data-act="res-cycle" data-id="' + r.id + '">Mark ' +
            (r.status === 'todo' ? 'in progress' : r.status === 'reading' ? 'finished' : 'to read') + '</a>' +
          '<a href="#" data-act="res-edit" data-id="' + r.id + '">Edit</a>' +
          '<a href="#" data-act="res-del" data-id="' + r.id + '">Remove</a>' +
        '</div>' +
        (local ? '<div class="hint">Local links open when you launch index.html straight from the folder, not through a server.</div>' : '') +
      '</div>';
    });
    h += '</div>';
  }

  v.innerHTML = h;
  var qi = $('#res-q');
  qi.oninput = function () { RES.q = qi.value; };

  $('#res-course').onchange = function () { RES.courseId = this.value; route(); };
  $('#res-type').onchange = function () { RES.type = this.value; route(); };
  $('#res-status').onchange = function () { RES.status = this.value; route(); };
}

function resFormModal(r) {

    '<div class="grid g3" style="gap:12px">' +
      '<div class="field"><label class="f">Type</label><select id="r-type">' + Object.keys(RES_TYPES).map(function (k) {
        return '<option value="' + k + '"' + (r.type === k ? ' selected' : '') + '>' + RES_TYPES[k].label + '</option>';
      }).join('') + '</select></div>' +
      '<div class="field"><label class="f">Course</label><select id="r-course"><option value="">— none —</option>' + courseOptions(r.courseId) + '</select></div>' +
      '<div class="field"><label class="f">Status</label><select id="r-status">' +
        ['todo', 'reading', 'done'].map(function (s) {
          return '<option value="' + s + '"' + (r.status === s ? ' selected' : '') + '>' +
            (s === 'todo' ? 'To read' : s === 'reading' ? 'In progress' : 'Finished') + '</option>';
        }).join('') + '</select></div>' +
    '</div>' +
    '<div class="field"><label class="f">Notes</label><textarea id="r-notes" placeholder="chapters to read, why it matters…">' + esc(r.notes || '') + '</textarea></div>' +

      '<button class="btn primary" id="r-ok">' + (isNew ? 'Add' : 'Save') + '</button></div>',
    function (box) {
      var url = box.querySelector('#r-url');
      url.onchange = function () {

      };
      box.querySelector('#r-ok').onclick = function () {

        r.notes = box.querySelector('#r-notes').value.trim();
        if (isNew) { r.addedAt = new Date().toISOString(); DB.resources.push(r); }
        dbSave(true); modalClose(); toast(isNew ? 'Resource added' : 'Saved'); route();
      };
    }
  );
}

/* ===== 60-notebooks.js ===== */
/* =============================================================================
   60-notebooks — links to wherever your notes actually live: Apple Notes,
   OneNote, Evernote, Notion, Obsidian, Logseq, a local folder…

   The app never touches note contents. It stores a link and opens it. Deep
   links (obsidian://, evernote:///, onenote:, notion://) open the desktop app;

   ========================================================================== */

var NBF = { courseId: '', app: '' };

function renderNotebooks(v) {
  var list = DB.notebooks.filter(function (n) {
    if (NBF.courseId && n.courseId !== NBF.courseId) return false;
    if (NBF.app && n.app !== NBF.app) return false;
    return true;
  });

  var h = '<div class="row"><div><h1>Notebooks</h1>' +
    '<p class="sub">One click to the notes for a course — in whichever app you write them.</p></div>' +
    '<span class="spacer"></span><button class="btn primary" data-act="nb-add">Link a notebook</button></div>';

  h += '<div class="card" style="margin-bottom:14px"><div class="row">' +
    '<select id="nb-course" class="filter">' + courseOptions(NBF.courseId, true) + '</select>' +
    '<select id="nb-app" class="filter"><option value="">All apps</option>' +
      Object.keys(NOTE_APPS).map(function (k) {
        return '<option value="' + k + '"' + (NBF.app === k ? ' selected' : '') + '>' + NOTE_APPS[k].label + '</option>';
      }).join('') + '</select>' +
    '<span class="spacer"></span><span class="pill"><b>' + list.length + '</b> notebook' + (list.length === 1 ? '' : 's') + '</span>' +
    '</div></div>';

  if (!DB.notebooks.length) {
    h += '<div class="empty">No notebooks linked yet.<br><br>' +
      '<button class="btn primary" data-act="nb-add">Link your first notebook</button>' +
      '<div class="hint" style="margin-top:14px">Obsidian: right-click a note, Copy Obsidian URL. Notion: page menu, Copy link. ' +
      'Apple Notes: Share, Copy Link. OneNote: right-click the page, Copy Link to Page.</div></div>';
  } else if (!list.length) {
    h += '<div class="empty">Nothing matches that filter.</div>';
  } else {
    h += '<div class="grid g3">';
    list.forEach(function (n) {
      var a = NOTE_APPS[n.app] || NOTE_APPS.other;
      h += '<div class="card course-card">' +
        '<div class="ttl">' + esc(n.title) + '</div>' +
        '<div class="row tight"><span class="tag">' + a.label + '</span>' +
          (n.courseId ? '<span class="tag"><span style="width:6px;height:6px;border-radius:1px;background:' + courseColor(n.courseId) + '"></span>' + esc(courseName(n.courseId)) + '</span>' : '') +
        '</div>' +
        (n.notes ? '<div class="mini">' + esc(n.notes) + '</div>' : '') +
        '<div class="linkline">' +
          (n.url ? '<a href="' + esc(asHref(n.url)) + '" target="_blank" rel="noopener">Open notebook</a>' : '') +
          (n.url ? '<a href="#" data-act="copy" data-v="' + esc(n.url) + '">Copy link</a>' : '') +
          '<a href="#" data-act="nb-edit" data-id="' + n.id + '">Edit</a>' +
          '<a href="#" data-act="nb-del" data-id="' + n.id + '">Remove</a>' +
        '</div>' +
      '</div>';
    });
    h += '</div>';
  }

  /* per-course roll-up, useful once there are many */
  var byCourse = {};
  DB.notebooks.forEach(function (n) { byCourse[n.courseId || ''] = (byCourse[n.courseId || ''] || 0) + 1; });
  if (DB.notebooks.length > 3) {
    h += '<div class="sechead"><h2>By course</h2></div><div class="card"><div class="chips">' +
      Object.keys(byCourse).map(function (cid) {
        return '<a class="chip" href="#/notebooks?course=' + cid + '">' + esc(cid ? courseName(cid) : 'Unassigned') + ' · ' + byCourse[cid] + '</a>';
      }).join('') + '</div></div>';
  }

  v.innerHTML = h;
  $('#nb-course').onchange = function () { NBF.courseId = this.value; route(); };
  $('#nb-app').onchange = function () { NBF.app = this.value; route(); };
}

function nbById(id) { return DB.notebooks.filter(function (n) { return n.id === id; })[0]; }

function nbFormModal(n) {
  var isNew = !n;
  n = n || { id: uid(), title: '', url: '', app: 'obsidian', courseId: NBF.courseId || '', notes: '' };
  modal(
    '<h2>' + (isNew ? 'Link a notebook' : 'Edit notebook') + '</h2>' +
    '<p class="sub">Your notes stay in your own app. This just remembers how to get there.</p>' +
    '<div class="field"><label class="f">Name *</label><input type="text" id="n-title" value="' + esc(n.title) + '" placeholder="e.g. Stats — lecture notes"></div>' +
    '<div class="field"><label class="f">App</label><select id="n-app">' + Object.keys(NOTE_APPS).map(function (k) {
      return '<option value="' + k + '"' + (n.app === k ? ' selected' : '') + '>' + NOTE_APPS[k].label + '</option>';
    }).join('') + '</select><div class="hint" id="n-hint"></div></div>' +
    '<div class="field"><label class="f">Link or path</label><input type="text" id="n-url" value="' + esc(n.url) + '" placeholder="obsidian://open?vault=Study&file=Stats"></div>' +
    '<div class="field"><label class="f">Course</label><select id="n-course"><option value="">— none —</option>' + courseOptions(n.courseId) + '</select></div>' +
    '<div class="field"><label class="f">Notes</label><input type="text" id="n-notes" value="' + esc(n.notes || '') + '" placeholder="what lives in here"></div>' +
    '<div class="modal-foot"><button class="btn" data-act="modal-close">Cancel</button>' +
      '<button class="btn primary" id="n-ok">' + (isNew ? 'Link it' : 'Save') + '</button></div>',
    function (box) {
      var app = box.querySelector('#n-app'), hint = box.querySelector('#n-hint');
      function drawHint() { hint.textContent = (NOTE_APPS[app.value] || NOTE_APPS.other).hint; }
      app.onchange = drawHint; drawHint();
      box.querySelector('#n-ok').onclick = function () {
        var title = box.querySelector('#n-title').value.trim();
        if (!title) { toast('Give it a name'); return; }
        n.title = title;
        n.app = app.value;
        n.url = box.querySelector('#n-url').value.trim();
        n.courseId = box.querySelector('#n-course').value;
        n.notes = box.querySelector('#n-notes').value.trim();
        if (isNew) { n.addedAt = new Date().toISOString(); DB.notebooks.push(n); }
        dbSave(true); modalClose(); toast(isNew ? 'Notebook linked' : 'Saved'); route();
      };
    }
  );
}

ACTIONS['nb-add'] = function () { nbFormModal(null); };
ACTIONS['nb-edit'] = function (el) { nbFormModal(nbById(el.getAttribute('data-id'))); };
ACTIONS['nb-del'] = function (el) {
  var n = nbById(el.getAttribute('data-id'));
  confirmBox('Unlink notebook?', esc(n.title) + ' will be removed from this list. Your notes are not touched.', 'Unlink', function () {
    DB.notebooks = DB.notebooks.filter(function (x) { return x.id !== n.id; });
    dbSave(true); toast('Unlinked'); route();
  });
};

/* ===== 70-map.js ===== */
/* =============================================================================
   70-map — the brain map, drawn as a wheel around a centre pivot.

   Layout   : every subject and topic is a point on ONE outer circle. Each
              course owns a contiguous arc of that circle: its own point in the
              middle of the arc, its topics either side, with a dimension
              bracket and the course name drawn outside.
   Threads  : every point is tied back to the centre pivot with a curved
              thread (the swirl comes from swinging the control point), and
              topics studied in the SAME session are tied to each other with
              chords that bow through the middle.
   Growth   : a point grows with every session logged against it; untouched
              topics stay hollow.
   Reading  : zoomed out it is just dots. Zoom in and the subject names appear,
              zoom further and the topic names do. Hover anything to isolate
              its threads.

   Plain canvas 2D, no libraries.
   ========================================================================== */

var MAP = {
  nodes: [], links: [], byKey: {},
  view: { k: 1, tx: 0, ty: 0 },
  rot: -Math.PI / 2,          // where the first course starts
  spin: true, labels: true,
  pan: null, hover: null, raf: null, ink: null
};

var MAP_RING = 320;      /* smaller wheel on a phone, so the names still fit */
function mapSizeRing() { MAP_RING = isNarrow() ? 250 : 320; }

function mapBuild() {
  var ts = topicStats();
  var nodes = [], links = [], byKey = {};
  var courses = DB.courses.filter(function (c) { return c.status !== 'dropped'; });
  if (!courses.length) { MAP.nodes = []; MAP.links = []; MAP.byKey = {}; return; }

  /* angular budget: one slot per point, plus a gap between subjects */
  var slots = 0;
  courses.forEach(function (c) { slots += 1 + (c.categories || []).length; });
  var gap = 0.055;
  var per = (Math.PI * 2 - gap * courses.length) / slots;

  var a = 0;
  courses.forEach(function (c) {
    var cats = (c.categories || []).slice();
    var n = cats.length + 1;
    var start = a, end = a + per * n;
    var p = progressOf(c);

    /* the subject sits in the middle of its arc, topics either side */
    var order = [], mid = Math.floor(n / 2);
    for (var i = 0; i < n; i++) order.push(i === mid ? null : cats.shift());

    order.forEach(function (topic, i) {
      var ang = start + per * (i + 0.5);
      if (topic === null) {
        var cn = {
          key: 'c::' + c.id, kind: 'course', label: c.name, color: courseColor(c.id), courseId: c.id,
          count: p.done, minutes: p.minutes, ang: ang,
          r: 5.5 + 1.5 * Math.sqrt(p.done), arc: [start, end]
        };
        nodes.push(cn); byKey[cn.key] = cn;
      } else {
        var key = c.id + '::' + topic;
        var st = ts.nodes[key] || { count: 0, minutes: 0, last: '' };
        var tn = {
          key: 't::' + key, kind: 'topic', label: topic, topic: topic, color: courseColor(c.id), courseId: c.id,
          count: st.count, minutes: st.minutes, last: st.last, ang: ang,
          r: st.count ? 3.4 + 2.1 * Math.sqrt(st.count) : 2.6
        };
        nodes.push(tn); byKey[tn.key] = tn;
      }
    });
    a = end + gap;
  });

  /* topics studied together in one sitting */
  Object.keys(ts.links).forEach(function (lk) {
    var pr = lk.split('|');
    var x = 't::' + pr[0], y = 't::' + pr[1];
    if (byKey[x] && byKey[y]) links.push({ a: x, b: y, w: ts.links[lk], kind: 'together' });
  });
  /* the same topic name in two different subjects */
  var byName = {};
  nodes.forEach(function (nd) {
    if (nd.kind !== 'topic') return;
    (byName[nd.topic.toLowerCase()] = byName[nd.topic.toLowerCase()] || []).push(nd);
  });
  Object.keys(byName).forEach(function (k) {
    var g = byName[k];
    for (var i = 0; i < g.length; i++) {
      for (var j = i + 1; j < g.length; j++) links.push({ a: g[i].key, b: g[j].key, w: 1, kind: 'bridge' });
    }
  });

  /* neighbour sets, so hovering can isolate one point's world */
  var nb = {};
  links.forEach(function (l) {
    (nb[l.a] = nb[l.a] || {})[l.b] = 1;
    (nb[l.b] = nb[l.b] || {})[l.a] = 1;
  });
  nodes.forEach(function (nd) {
    nd.nb = nb[nd.key] || {};
    if (nd.kind === 'topic') nd.nb['c::' + nd.courseId] = 1;
  });
  nodes.forEach(function (nd) {
    if (nd.kind !== 'course') return;
    nodes.forEach(function (o) { if (o.kind === 'topic' && o.courseId === nd.courseId) nd.nb[o.key] = 1; });
  });

  MAP.nodes = nodes; MAP.links = links; MAP.byKey = byKey;
}

/* colours borrowed from the stylesheet, so the map follows the theme */
function mapInk() {
  var theme = document.documentElement.getAttribute('data-theme') || 'light';
  if (MAP.ink && MAP.ink.theme === theme) return MAP.ink;
  var css = getComputedStyle(document.documentElement);
  var get = function (k, fb) { return (css.getPropertyValue(k) || '').trim() || fb; };
  MAP.ink = {
    theme: theme,
    paper: get('--surface', '#fff'),
    ink: get('--ink', '#14171A'),
    dim: get('--ink-2', '#454A47'),
    faint: get('--ink-3', '#767C77'),
    rule: get('--rule-2', '#A8ADA4'),
    serif: '"Iowan Old Style", Palatino, Georgia, serif'
  };
  return MAP.ink;
}

function mapS(x, y) { return [x * MAP.view.k + MAP.view.tx, y * MAP.view.k + MAP.view.ty]; }

function mapPositions() {
  MAP.nodes.forEach(function (n) {
    var a = n.ang + MAP.rot;
    n.wx = Math.cos(a) * MAP_RING;
    n.wy = Math.sin(a) * MAP_RING;
    var s = mapS(n.wx, n.wy);
    n.sx = s[0]; n.sy = s[1]; n.sa = a;
  });
}

/* a thread from a ring point to the pivot, bowed to give the wheel its spin */
function mapCentrePath(ctx, n, cx, cy) {
  var c = mapS(Math.cos(n.sa + 0.34) * MAP_RING * 0.48, Math.sin(n.sa + 0.34) * MAP_RING * 0.48);
  ctx.beginPath();
  ctx.moveTo(n.sx, n.sy);
  ctx.quadraticCurveTo(c[0], c[1], cx, cy);
}

function mapDraw() {
  var cv = $('#map');
  if (!cv) return;
  var dpr = window.devicePixelRatio || 1;
  var W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  var ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  var ink = mapInk(), k = MAP.view.k;
  mapPositions();
  var ctr = mapS(0, 0), cx = ctr[0], cy = ctr[1];
  var hov = MAP.hover;
  var lit = function (n) { return !hov || hov.key === n.key || hov.nb[n.key]; };

  /* the ring, as a construction line */
  ctx.beginPath();
  ctx.arc(cx, cy, MAP_RING * k, 0, 6.2832);
  ctx.strokeStyle = ink.rule;
  ctx.globalAlpha = 0.45;
  ctx.setLineDash([2, 5]);
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;

  /* a dimension bracket per subject, outside the ring */
  MAP.nodes.forEach(function (n) {
    if (n.kind !== 'course' || !n.arc) return;
    var on = lit(n);
    ctx.strokeStyle = n.color;
    ctx.globalAlpha = on ? 0.75 : 0.1;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(cx, cy, (MAP_RING + 20) * k, n.arc[0] + MAP.rot, n.arc[1] + MAP.rot);
    ctx.stroke();
    [n.arc[0], n.arc[1]].forEach(function (a) {
      var A = a + MAP.rot;
      var p0 = mapS(Math.cos(A) * (MAP_RING + 13), Math.sin(A) * (MAP_RING + 13));
      var p1 = mapS(Math.cos(A) * (MAP_RING + 27), Math.sin(A) * (MAP_RING + 27));
      ctx.beginPath();
      ctx.moveTo(p0[0], p0[1]);
      ctx.lineTo(p1[0], p1[1]);
      ctx.stroke();
    });
    ctx.globalAlpha = 1;
  });

  /* threads to the pivot */
  MAP.nodes.forEach(function (n) {
    var on = lit(n);
    mapCentrePath(ctx, n, cx, cy);
    ctx.strokeStyle = n.kind === 'course' ? n.color : (n.count ? n.color : ink.rule);
    ctx.globalAlpha = on ? (n.kind === 'course' ? 0.7 : n.count ? 0.45 : 0.2) : 0.055;
    ctx.lineWidth = (n.kind === 'course' ? 1.3 : 0.8) * clamp(k, 0.6, 1.6);
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  /* chords between related topics, bowed through the middle */
  MAP.links.forEach(function (l) {
    var a = MAP.byKey[l.a], b = MAP.byKey[l.b];
    if (!a || !b) return;
    var on = !hov || hov.key === a.key || hov.key === b.key;
    var c = mapS((a.wx + b.wx) / 2 * 0.32, (a.wy + b.wy) / 2 * 0.32);
    ctx.beginPath();
    ctx.moveTo(a.sx, a.sy);
    ctx.quadraticCurveTo(c[0], c[1], b.sx, b.sy);
    if (l.kind === 'bridge') {
      ctx.strokeStyle = ink.faint;
      ctx.globalAlpha = on ? (hov ? 0.7 : 0.28) : 0.05;
      ctx.lineWidth = 0.8;
      ctx.setLineDash([3, 4]);
    } else {
      ctx.strokeStyle = a.color;
      ctx.globalAlpha = on ? (hov ? 0.95 : 0.5) : 0.05;
      ctx.lineWidth = Math.min(3, 0.7 + l.w * 0.32) * clamp(k, 0.6, 1.5);
      ctx.setLineDash([]);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  });
  ctx.globalAlpha = 1;

  /* the pivot */
  var pr = 4 + 2 * Math.min(1.6, k);
  ctx.beginPath();
  ctx.arc(cx, cy, pr, 0, 6.2832);
  ctx.fillStyle = ink.ink;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(cx, cy, pr + 5, 0, 6.2832);
  ctx.strokeStyle = ink.faint;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.6;
  ctx.stroke();
  ctx.globalAlpha = 1;

  /* the points */
  MAP.nodes.forEach(function (n) {
    var on = lit(n);
    var R = Math.max(1.8, n.r * clamp(Math.sqrt(k), 0.55, 1.8));
    ctx.globalAlpha = on ? 1 : 0.16;
    ctx.beginPath();
    ctx.arc(n.sx, n.sy, R, 0, 6.2832);
    if (n.count) {
      ctx.fillStyle = n.color;
      ctx.fill();
    } else {
      ctx.fillStyle = ink.paper;
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = n.color;
      ctx.stroke();
    }
    if (n.kind === 'course') {                       // subjects get a drawn collar
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, R + 3.5, 0, 6.2832);
      ctx.strokeStyle = n.color;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    if (hov && hov.key === n.key) {
      ctx.beginPath();
      ctx.arc(n.sx, n.sy, R + 7, 0, 6.2832);
      ctx.strokeStyle = ink.ink;
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  });

  /* labels: dots when zoomed out, names as you come closer */
  if (MAP.labels) {
    var showCourse = k >= 0.42, showTopic = k >= 0.9;
    MAP.nodes.forEach(function (n) {
      var isHov = hov && hov.key === n.key;
      if (!(isHov || (n.kind === 'course' ? showCourse : showTopic)) || !lit(n)) return;
      var a = n.sa, flip = Math.cos(a) < 0;
      var out = n.kind === 'course' ? MAP_RING + 34 : MAP_RING + 11;
      var p = mapS(Math.cos(a) * out, Math.sin(a) * out);
      ctx.save();
      ctx.translate(p[0], p[1]);
      ctx.rotate(flip ? a + Math.PI : a);
      ctx.textAlign = flip ? 'right' : 'left';
      ctx.textBaseline = 'middle';
      ctx.font = (n.kind === 'course' ? (isNarrow() ? '600 11.5px ' : '600 13px ') : '400 11.5px ') + ink.serif;
      var label = n.kind === 'course' ? n.label : n.label + (n.count ? ' · ' + n.count : '');
      if (isNarrow() && label.length > 11) label = label.slice(0, 10) + '…';
      ctx.strokeStyle = ink.paper;
      ctx.lineWidth = 3.5;
      ctx.strokeText(label, 0, 0);
      ctx.fillStyle = n.kind === 'course' ? ink.ink : ink.dim;
      ctx.fillText(label, 0, 0);
      ctx.restore();
    });
  }

  /* pivot caption */
  ctx.font = '600 9.5px ' + ink.serif;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  var cap = DB.profile.name ? DB.profile.name.toUpperCase() : 'ALL SUBJECTS';
  ctx.strokeStyle = ink.paper;
  ctx.lineWidth = 3;
  ctx.strokeText(cap, cx, cy + pr + 9);
  ctx.fillStyle = ink.faint;
  ctx.fillText(cap, cx, cy + pr + 9);
}

function mapTick() {
  if (!$('#map')) { MAP.raf = null; return; }
  if (MAP.spin) MAP.rot += 0.0012;
  mapDraw();
  MAP.raf = requestAnimationFrame(mapTick);
}

function mapFit() {
  var cv = $('#map');
  if (!cv) return;
  var W = cv.clientWidth, H = cv.clientHeight;
  /* reserve room in SCREEN pixels for the labels that sit outside the ring,
     so a long subject name never runs off the sheet */
  var m = isNarrow() ? 72 : 100;
  MAP.view.k = clamp(Math.min((W - m * 2) / (MAP_RING * 2), (H - m * 1.5) / (MAP_RING * 2)), 0.28, 3);
  MAP.view.tx = W / 2;
  MAP.view.ty = H / 2;
}

function mapNodeAt(mx, my) {
  var best = null, bestD = 1e9;
  MAP.nodes.forEach(function (n) {
    var R = Math.max(9, n.r * Math.sqrt(MAP.view.k) + 7);
    var d = (n.sx - mx) * (n.sx - mx) + (n.sy - my) * (n.sy - my);
    if (d < R * R && d < bestD) { best = n; bestD = d; }
  });
  return best;
}

function mapZoomAt(mx, my, f) {
  var k2 = clamp(MAP.view.k * f, 0.16, 4);
  f = k2 / MAP.view.k;
  MAP.view.tx = mx - (mx - MAP.view.tx) * f;
  MAP.view.ty = my - (my - MAP.view.ty) * f;
  MAP.view.k = k2;
}

function renderMap(v) {
  var ts = topicStats();
  var totalTopics = 0, litTopics = 0;
  DB.courses.forEach(function (c) {
    if (c.status === 'dropped') return;
    (c.categories || []).forEach(function (t) {
      totalTopics++;
      if (ts.nodes[c.id + '::' + t]) litTopics++;
    });
  });

  var h = '<h1>Brain Map</h1>' +
    '<p class="sub">Every subject and topic is a point on the wheel, tied back to one pivot. ' +
    'Points grow as you log sessions; topics studied together get threaded to each other.</p>' +
    '<div class="row tight" style="margin-bottom:14px">' +
      '<span class="pill"><b>' + litTopics + '</b> of ' + totalTopics + ' topics started</span>' +
      '<span class="pill"><b>' + Object.keys(ts.links).length + '</b> threads</span>' +
      '<span class="pill"><b>' + DB.courses.filter(function (c) { return c.status !== 'dropped'; }).length + '</b> subjects</span>' +
    '</div>';

  if (!totalTopics) {
    h += '<div class="empty">Your map needs topics.<br><br>Add a few to any course in ' +
      '<a href="#/classroom">Classroom</a> (e.g. Regression, ANOVA, p-values), then tick them off while logging a session.</div>';
    v.innerHTML = h;
    return;
  }

  h += '<div id="map-wrap">' +
    '<canvas id="map"></canvas>' +
    '<div id="map-ctl">' +
      '<button class="btn sm" data-act="map-zoom" data-d="1.35">Zoom in</button>' +
      '<button class="btn sm" data-act="map-zoom" data-d="0.74">Zoom out</button>' +
      '<button class="btn sm" data-act="map-fit">Fit</button>' +
      '<button class="btn sm" data-act="map-spin">' + (MAP.spin ? 'Stop' : 'Spin') + '</button>' +
      '<button class="btn sm" data-act="map-labels">Labels</button>' +
    '</div>' +
    '<div id="map-tip" class="hidden"></div>' +
    '</div>' +
    '<div class="chips" style="margin:12px 0">' + DB.courses.filter(function (c) { return c.status !== 'dropped'; }).map(function (c) {

    }).join('') + '</div>' +

  v.innerHTML = h;

  mapSizeRing();
  mapBuild();
  var cv = $('#map');
  mapFit();
  if (MAP.raf) cancelAnimationFrame(MAP.raf);
  mapTick();

  var tip = $('#map-tip');
  function local(e) {
    var r = cv.getBoundingClientRect();
    return [e.clientX - r.left, e.clientY - r.top];
  }
  function hoverAt(mx, my) {
    var n = mapNodeAt(mx, my);
    MAP.hover = n;
    if (!n) { tip.classList.add('hidden'); return; }
    tip.classList.remove('hidden');
    tip.style.left = Math.min(Math.max(6, mx + 14), Math.max(6, cv.clientWidth - 250)) + 'px';
    tip.style.top = Math.max(6, my - 12) + 'px';
    tip.innerHTML = '<b>' + esc(n.label) + '</b><br><span class="mini">' +
      (n.kind === 'course'
        ? 'subject · ' + n.count + ' sessions · ' + fmtMins(n.minutes) + ' · ' +
          (((courseById(n.courseId) || {}).categories) || []).length + ' topics'
        : esc(courseName(n.courseId)) + ' · ' +
          (n.count ? n.count + ' sessions · ' + fmtMins(n.minutes) + (n.last ? ' · last ' + fmtShort(n.last) : '')
                   : 'not started')) + '</span>';
  }

  cv.onpointermove = function (e) {
    var l = local(e);
    if (MAP.pan) {
      MAP.view.tx = MAP.pan.tx + (l[0] - MAP.pan.mx);
      MAP.view.ty = MAP.pan.ty + (l[1] - MAP.pan.my);
      return;
    }
    hoverAt(l[0], l[1]);
  };
  cv.onpointerdown = function (e) {
    var l = local(e);
    try { cv.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    MAP.pan = { mx: l[0], my: l[1], tx: MAP.view.tx, ty: MAP.view.ty };
    cv.classList.add('drag');
    if (e.pointerType !== 'mouse') hoverAt(l[0], l[1]);
  };
  cv.onpointerup = function (e) {
    var l = local(e);
    var moved = MAP.pan && (Math.abs(l[0] - MAP.pan.mx) > 4 || Math.abs(l[1] - MAP.pan.my) > 4);
    MAP.pan = null;
    cv.classList.remove('drag');
    if (moved) return;
    var n = mapNodeAt(l[0], l[1]);
    if (n) mapNodeModal(n);
  };
  cv.onpointerleave = function () {
    MAP.hover = null; MAP.pan = null;
    tip.classList.add('hidden');
    cv.classList.remove('drag');
  };
  cv.onwheel = function (e) {
    e.preventDefault();
    var l = local(e);
    mapZoomAt(l[0], l[1], Math.exp(-e.deltaY * 0.0016));
  };
}

/* sessions/day over the last N days, used for projections */
function recentPace(courseId, days) {
  days = days || 14;
  var from = shiftDays(today(), -(days - 1));
  var list = DB.sessions.filter(function (s) {
    return s.date >= from && s.date <= today() && (!courseId || s.courseId === courseId);
  });
  return sumCount(list) / days;
}

function projectFinish(c) {
  var p = progressOf(c);
  if (!c.totalSessions || p.remaining <= 0) return null;
  var pace = recentPace(c.id, 21);
  if (pace <= 0) return { eta: null, pace: 0 };
  return { eta: shiftDays(today(), Math.ceil(p.remaining / pace)), pace: pace };
}

function renderStats(v) {
  var narrow = isNarrow();

      '<span class="n">current / longest</span></div>' +
    '<div class="card kpi"><span class="k">Best day</span><span class="v">' + fmtMins(best.m) + '</span>' +
      '<span class="n">' + (best.d ? fmtDate(best.d) : '—') + '</span></div>' +
    '<div class="card kpi"><span class="k">Last 30 days</span><span class="v">' + fmtMins(sumMins(sessionsInRange(shiftDays(today(), -29), today()))) + '</span>' +

  }
  h += '<div class="sechead"><h2>' + (narrow ? 'Last 8 weeks' : 'Last 12 weeks') + '</h2>' +
    '<span class="mini">minutes per week</span></div>' +
    '<div class="card">' + barsSVG(wk, { fmt: fmtMins, w: CW, h: narrow ? 120 : 160 }) + '</div>';

  /* months */
  var months = monthlySummary().slice().reverse();
  h += '<div class="sechead"><h2>Month by month</h2><span class="mini">total time</span></div>' +
    '<div class="card">' + barsSVG(months.slice(narrow ? -8 : -14).map(function (m) { return { label: fmtMonth(m.key).slice(0, 3) + ' ' + m.key.slice(2, 4), v: m.minutes }; }), { fmt: fmtMins, w: CW, h: narrow ? 120 : 160 }) + '</div>';

  /* weekday shape */

  h += '<div class="sechead"><h2>Which days you actually study</h2><span class="mini">average minutes on days you logged</span></div>' +
    '<div class="card">' + barsSVG(DOW.map(function (n, i2) { return { label: n, v: wdn[i2] ? Math.round(wd[i2] / wdn[i2]) : 0 }; }), { fmt: fmtMins, h: narrow ? 110 : 130, w: CW }) + '</div>';

  /* where the time actually went */

  var byTopic = timeByTopic(DB.sessions, 8);
  h += '<div class="sechead"><h2>Where the time went</h2><span class="mini">share of tracked minutes</span></div>' +
    '<div class="grid g2">' +
      '<div class="card"><h3>By course</h3>' +
        donutSVG(byCourse, { fmt: fmtMins, centreNote: 'tracked', size: narrow ? 190 : 230 }) + legendHTML(byCourse, { fmt: fmtMins }) + '</div>' +
      '<div class="card"><h3>By topic</h3>' +

  DB.courses.forEach(function (c) {
    var p = progressOf(c), pr = projectFinish(c), need = paceNeeded(c);
    var etaTxt = '—', cls = '';
    if (pr && pr.eta) {
      etaTxt = fmtShortY(pr.eta);
      if (c.deadline) {
        var slack = daysBetween(pr.eta, c.deadline);
        cls = slack >= 0 ? 'ok' : 'bad';
        etaTxt += ' <span class="pill ' + cls + '">' + (slack >= 0 ? slack + 'd early' : Math.abs(slack) + 'd late') + '</span>';
      }
    } else if (pr) {
      etaTxt = '<span class="mini">no recent activity</span>';
    } else if (c.totalSessions && p.remaining === 0) {
      etaTxt = '<span class="pill ok">target met</span>';
    }
    h += '<tr>' +
      '<td><span class="row tight"><span style="display:inline-block;width:8px;height:8px;border-radius:1px;background:' + courseColor(c.id) + '"></span>' +
        esc(c.name) + (c.status !== 'active' ? ' <span class="tag">' + c.status + '</span>' : '') + '</span></td>' +
      '<td class="num">' + p.done + (c.totalSessions ? ' / ' + c.totalSessions : '') + '</td>' +
      '<td class="num" style="min-width:110px"><div class="bar"><i style="width:' + p.pct + '%"></i></div><span class="mini">' + p.pct + '%</span></td>' +
      '<td class="num">' + fmtMins(p.minutes) + '</td>' +

      '<td>' + (c.deadline ? fmtShortY(c.deadline) + (need && need !== Infinity ? ' <span class="mini">(' + need.toFixed(1) + '/day needed)</span>' : '') : '<span class="mini">none</span>') + '</td>' +
      '<td>' + etaTxt + '</td>' +
    '</tr>';
  });
  h += '</tbody></table></div>';

  /* topics */
  var ts = topicStats();
  var tk = Object.keys(ts.nodes).sort(function (a, b) { return ts.nodes[b].minutes - ts.nodes[a].minutes; }).slice(0, 15);
  if (tk.length) {
    h += '<div class="sechead"><h2>Most studied topics</h2><a class="mini" href="#/map">See the map</a></div>' +
      '<div class="card scroll-x"><table><thead><tr><th>Topic</th><th>Course</th><th class="num">Sessions</th><th class="num">Time</th><th>Last</th></tr></thead><tbody>' +
      tk.map(function (k) {

      }).join('') + '</tbody></table></div>';
  }

  v.innerHTML = h;
}

/* ===== 90-pomodoro.js ===== */
/* =============================================================================
   90-pomodoro — the timer widget. Lives in the top bar on every page, opens
   into a panel. Survives page switches and reloads (it stores an end time, not
   a countdown), and can log the finished block straight into a course.
   ========================================================================== */

var POMO_LABEL = { focus: 'Focus', short: 'Short break', long: 'Long break' };

function pomoCfg() { return DB.pomoCfg; }
function pomoLen(phase) {
  var c = pomoCfg();
  return (phase === 'focus' ? c.focus : phase === 'short' ? c.short : c.long) * 60;
}

function pomoState() {
  if (!DB.pomo) DB.pomo = { phase: 'focus', running: false, endsAt: 0, left: pomoLen('focus'), cycles: 0, courseId: null };
  return DB.pomo;
}
function pomoLeft() {
  var p = pomoState();
  return p.running ? Math.max(0, (p.endsAt - Date.now()) / 1000) : p.left;
}

function pomoBeep(times) {
  if (!pomoCfg().sound) return;
  try {
    var Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    var ctx = new Ctx();
    for (var i = 0; i < (times || 2); i++) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      var t0 = ctx.currentTime + i * 0.32;
      o.type = 'sine';
      o.frequency.setValueAtTime(i % 2 ? 660 : 880, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.22, t0 + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.28);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + 0.3);
    }
    setTimeout(function () { ctx.close(); }, 1500);
  } catch (e) { /* audio is a nice-to-have */ }
}

function pomoNotify(title, body) {
  try {
    if (window.Notification && Notification.permission === 'granted') {
      new Notification(title, { body: body });
    }
  } catch (e) { /* ignore */ }
}

function pomoStart() {
  var p = pomoState();
  if (p.running) return;
  if (p.left <= 0) p.left = pomoLen(p.phase);
  p.endsAt = Date.now() + p.left * 1000;
  p.running = true;
  dbSave(true);
  if (window.Notification && Notification.permission === 'default') {
    try { Notification.requestPermission(); } catch (e) { /* ignore */ }
  }
  pomoPaint();
}
function pomoPause() {
  var p = pomoState();
  if (!p.running) return;
  p.left = pomoLeft();
  p.running = false;
  dbSave(true);
  pomoPaint();
}
function pomoReset() {
  var p = pomoState();
  p.running = false;
  p.left = pomoLen(p.phase);
  dbSave(true);
  pomoPaint();
}
function pomoSetPhase(phase, autoStart) {
  var p = pomoState();
  p.phase = phase;
  p.left = pomoLen(phase);
  p.running = false;
  if (autoStart) pomoStart(); else { dbSave(true); pomoPaint(); }
}

/* a focus block ran out */
function pomoFinish(awayMinutes) {
  var p = pomoState(), c = pomoCfg();
  if (p.phase === 'focus') {
    p.cycles = (p.cycles || 0) + 1;
    var mins = c.focus;
    var course = p.courseId ? courseById(p.courseId) : null;
    if (c.autoLog && course) {
      DB.sessions.push({
        id: uid(), courseId: course.id, date: today(),
        count: c.countAsSession ? 1 : 0, minutes: mins,
        topics: [], note: 'Pomodoro', createdAt: new Date().toISOString()
      });
      DB.lastCourseId = course.id;
      toast('Focus block done — ' + fmtMins(mins) + ' logged to ' + esc(course.name));
    } else {
      toast('Focus block done — ' + fmtMins(mins), 8000, course ? 'Log it' : null, course ? function () {
        DB.sessions.push({
          id: uid(), courseId: course.id, date: today(), count: c.countAsSession ? 1 : 0,
          minutes: mins, topics: [], note: 'Pomodoro', createdAt: new Date().toISOString()
        });
        dbSave(true); route();
      } : null);
    }
    pomoBeep(3);
    pomoNotify('Focus block done', (course ? course.name + ' · ' : '') + 'take a break');
    var nextPhase = (p.cycles % (c.cycle || 4) === 0) ? 'long' : 'short';
    pomoSetPhase(nextPhase, false);
  } else {
    pomoBeep(2);
    pomoNotify('Break over', 'Back to it');
    toast('Break over — next focus block ready');
    pomoSetPhase('focus', false);
  }
  if (awayMinutes) toast('The timer finished while this tab was away.', 4000);
  dbSave(true);
  route();
}

var POMO_RING = 168;

/* structure is built once; pomoPaint() then only rewrites the numbers, so the
   settings inputs never lose focus to the 4×/second tick */
function pomoMountMini() {

      '<div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center">' +
        '<div class="clock" id="pm-clock">--:--</div>' +

    '</div>' +
    '<div class="field" style="margin-bottom:8px"><label class="f">Working on</label>' +

    '<div class="row tight mini" style="margin-bottom:10px">' +
      '<span class="pill"><b id="pm-cycles">' + (p.cycles || 0) + '</b> blocks done</span>' +
      '<span class="pill" id="pm-lens">' + c.focus + '/' + c.short + '/' + c.long + ' min</span>' +

/* cheap per-tick update of just the changing numbers */
function pomoPaint() {
  var p = pomoState(), left = pomoLeft(), mini = $('#pomo-mini');
  if (!mini) return;
  if (!$('#pm-toggle')) pomoMountMini();
  mini.className = p.phase === 'focus' ? 'focus' : 'break';
  $('#pomo-mini .t').textContent = fmtClock(left);
  $('#pm-lbl').textContent = POMO_LABEL[p.phase];
  $('#pm-toggle').textContent = p.running ? 'Pause' : 'Start';

  var panel = $('#pomo-panel');
  if (!panel || panel.classList.contains('hidden') || !$('#pm-clock')) return;
  $('#pm-clock').textContent = fmtClock(left);
  $('#pm-phase').textContent = POMO_LABEL[p.phase];
  $('#pm-big').textContent = p.running ? 'Pause' : 'Start';
  $('#pm-cycles').textContent = p.cycles || 0;
  var arc = $('#pm-arc');
  if (arc) {
    var circ = 2 * Math.PI * (POMO_RING / 2 - 12);
    var frac = 1 - left / (pomoLen(p.phase) || 1);
    arc.setAttribute('stroke-dashoffset', (circ * (1 - clamp(frac, 0, 1))).toFixed(1));
  }
}

function pomoTick() {
  var p = pomoState();
  if (p.running && pomoLeft() <= 0) { p.running = false; p.left = 0; pomoFinish(false); return; }
  pomoPaint();
}

function pomoBoot() {
  var p = pomoState();
  if (p.running && p.endsAt && Date.now() > p.endsAt) {
    p.running = false; p.left = 0;
    pomoFinish(true);
  }
  setInterval(pomoTick, 250);
  pomoPaint();
}

/* =============================================================================
   95-data — settings, first-run setup, CSV import, JSON backup/restore.

   There is no server and no account, so a backup is a file you keep. Export
   whenever you have done real work; the file restores everything exactly.

function downloadFile(name, text, mime) {
  var blob = new Blob([text], { type: mime || 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

/* --- CSV: a small but correct parser (quotes, embedded commas/newlines) --- */
function parseCSV(text) {
  var rows = [], row = [], cur = '', q = false, i, ch;
  text = String(text).replace(/\r\n?/g, '\n');
  for (i = 0; i < text.length; i++) {
    ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cur); cur = ''; }
    else if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += ch;
  }
  row.push(cur); rows.push(row);
  return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
}

function csvEscape(v) {
  v = String(v == null ? '' : v);
  return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}

/* find the header row, then map the columns we care about */
function coursesFromCSV(text) {
  var rows = parseCSV(text);
  var hdr = -1, map = {};
  for (var r = 0; r < rows.length && hdr < 0; r++) {
    var low = rows[r].map(function (c) { return String(c).trim().toLowerCase(); });
    if (low.indexOf('subject') >= 0 || low.indexOf('course') >= 0 || low.indexOf('name') >= 0) {
      hdr = r;
      low.forEach(function (c, i) {
        if (/^(subject|course|name|course name)$/.test(c)) map.name = i;
        else if (/link|url|playlist|class/.test(c) && map.link == null) map.link = i;
        else if (/resource|material|folder|drive/.test(c) && map.res == null) map.res = i;
        else if (/total/.test(c)) map.total = i;
        else if (/remain|left/.test(c)) map.remaining = i;
        else if (/deadline|due/.test(c)) map.deadline = i;
        else if (/categor|topic/.test(c)) map.topics = i;
      });
    }
  }
  if (hdr < 0) return null;
  var out = [];
  for (var k = hdr + 1; k < rows.length; k++) {
    var row = rows[k];
    var name = String(row[map.name] || '').trim();
    if (!name) continue;
    var total = num(row[map.total], 0);
    var remaining = map.remaining != null && String(row[map.remaining]).trim() !== '' ? num(row[map.remaining], total) : total;
    out.push({
      name: name,
      link: String(row[map.link] || '').trim(),
      res: String(row[map.res] || '').trim(),
      total: total,
      done: Math.max(0, total - remaining),
      deadline: map.deadline != null ? String(row[map.deadline] || '').trim() : '',
      topics: map.topics != null ? String(row[map.topics] || '').split(/[;|]/).map(function (s) { return s.trim(); }).filter(Boolean) : []
    });
  }
  return out;
}

function importCourseRows(rows, opts) {
  opts = opts || {};
  var added = 0, updated = 0, res = 0;
  rows.forEach(function (r) {
    var existing = DB.courses.filter(function (c) { return c.name.toLowerCase() === r.name.toLowerCase(); })[0];
    var c = existing;
    if (!c) {
      c = newCourse({
        name: r.name, link: r.link, totalSessions: r.total, doneOffset: r.done,
        deadline: /^\d{4}-\d{2}-\d{2}$/.test(r.deadline) ? r.deadline : '',
        categories: r.topics
      });
      c.color = PALETTE[DB.courses.length % PALETTE.length];
      DB.courses.push(c);
      added++;
    } else if (opts.update) {
      if (r.link) c.link = r.link;
      if (r.total) c.totalSessions = r.total;
      if (r.done) c.doneOffset = r.done;
      if (r.topics.length) r.topics.forEach(function (t) { if (c.categories.indexOf(t) < 0) c.categories.push(t); });
      updated++;
    }
    if (r.res) {
      var dupe = DB.resources.filter(function (x) { return x.url === r.res && x.courseId === c.id; })[0];
      if (!dupe) {
        DB.resources.push({
          id: uid(), title: r.name + ' — course materials', url: r.res,
          type: guessType(r.res), courseId: c.id, status: 'todo', notes: 'From CSV import',
          addedAt: new Date().toISOString()
        });
        res++;
      }
    }
  });
  dbSave(true);
  toast('Imported ' + added + ' course' + (added === 1 ? '' : 's') +
        (updated ? ', updated ' + updated : '') + (res ? ', + ' + res + ' resources' : ''), 4000);
  return { added: added, updated: updated, res: res };
}

function seedStarter() {
  importCourseRows(STARTER_COURSES.map(function (r) {
    return { name: r[0], link: r[1], res: r[2], total: r[3], done: Math.max(0, r[3] - r[4]), deadline: '', topics: [] };
  }), { update: false });
  route();
}

  var q = {};
  (parts[1] || '').split('&').forEach(function (kv) {
    if (!kv) return;
    var p = kv.split('=');
    q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
  });
  if (!ROUTES[page]) page = 'dashboard';

  if (page === 'resources' && q.course != null) RES.courseId = q.course;
  if (page === 'notebooks' && q.course != null) NBF.courseId = q.course;

  $$('#nav a').forEach(function (a) {
    a.classList.toggle('on', a.getAttribute('href').indexOf('#/' + page) === 0);
  });

  if (page !== 'map' && MAP.raf) { cancelAnimationFrame(MAP.raf); MAP.raf = null; }
  if (page === 'dashboard' || page === 'calendar') {
    if (!LOGF.courseId || !courseById(LOGF.courseId)) logReset(page === 'calendar' ? CAL.sel : today());
  }

  var v = $('#view');
  ROUTES[page](v);
  if (page !== ROUTE_LAST) { window.scrollTo(0, 0); ROUTE_LAST = page; }
  renderTopStats();
  pomoPaint();
}

/* The top bar stays empty on the desktop — the timer is the only thing that
   belongs in every view. On a phone it also carries the log button, because
   the form itself is a scroll away. */
function renderTopStats() {
  var t = today();
  var mins = sumMins(DB.sessions.filter(function (s) { return s.date === t; }));
  var goal = DB.profile.dailyGoalMin || 0;
  $('#topstats').innerHTML =
    '<button class="btn sm primary only-narrow" data-act="quick-log">Log a session</button>' +
    '<span class="pill only-narrow"><b>' + fmtMins(mins) + '</b>' + (goal ? ' / ' + fmtMins(goal) : '') + '</span>';
  $('#whoami').textContent = DB.profile.name ? DB.profile.name : 'local & offline';
  storeRefreshLine();          // one owner for the storage line and the footer
}

ACTIONS['quick-log'] = function () {
  if (!DB.courses.length) { location.hash = '#/classroom'; route(); ACTIONS['course-add'](); return; }
  logReset(today());
  modal(logCardHTML({ prefix: 'qlog' }).replace('class="card"', 'class=""'), function () { wireLog(); });
};
ACTIONS['modal-close'] = function () { modalClose(); };

/* ------------------------------- theme ---------------------------------- */
function applyTheme() {
  var dark = DB.profile.theme === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
  var b = $('#theme-btn');
  if (b) b.textContent = dark ? 'Paper mode' : 'Dark mode';
  MAP.ink = null;
}
ACTIONS['theme'] = function () {
  DB.profile.theme = DB.profile.theme === 'light' ? 'dark' : 'light';
  applyTheme();
  dbSave(true);
  route();
};

/* --------------------------- global listeners ---------------------------- */

document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var fn = ACTIONS[el.getAttribute('data-act')];
  if (!fn) return;
  if (el.tagName === 'A' && (el.getAttribute('href') === '#' || !el.getAttribute('href'))) e.preventDefault();
  if (el.tagName === 'BUTTON' && el.type !== 'submit') e.preventDefault();
  fn(el, e);
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { modalClose(); return; }
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.metaKey || e.ctrlKey || e.altKey) return;
  if ($('#modal-root').classList.contains('on')) return;
  var k = e.key.toLowerCase();
  if (k === 'l') { e.preventDefault(); ACTIONS['quick-log'](); }
  else if (k === 'p') { e.preventDefault(); ACTIONS['pomo-toggle'](); }
  else if (k === 't') { e.preventDefault(); ACTIONS['theme'](); }
  else if (k === 'm') { location.hash = '#/map'; }
  else if (k === 'c') { location.hash = '#/calendar'; }
  else if (k === '?') {
    modal('<h2>Keyboard shortcuts</h2><div class="mini" style="line-height:1.9">' +
      '<p><b>L</b> — log a session &nbsp;&nbsp; <b>P</b> — start or pause the timer &nbsp;&nbsp; <b>T</b> — switch theme</p>' +
      '<p><b>C</b> — calendar &nbsp;&nbsp; <b>M</b> — brain map &nbsp;&nbsp; <b>Esc</b> — close a dialog</p>' +
      '<p>Inside the log form, <b>Enter</b> saves.</p></div>' +
      '<div class="modal-foot"><button class="btn" data-act="modal-close">Got it</button></div>');
  }
});

window.addEventListener('hashchange', route);
window.addEventListener('resize', function () {
  if (!$('#map')) return;
  mapSizeRing();
  mapFit();
  mapDraw();
});
$('#theme-btn').setAttribute('data-act', 'theme');
$('#modal-root').querySelector('.scrim').addEventListener('click', modalClose);
window.addEventListener('beforeunload', function () { dbSave(true); });

/* deadlines that arrived while you were away — ask once per day, per course */
function deadlineCheck() {
  var due = DB.courses.filter(function (c) {
    return c.status === 'active' && c.deadline && daysLeft(c) <= 0 && c.lastAsked !== today();
  });
  if (!due.length) return;
  var c = due[0];
  c.lastAsked = today();
  dbSave(true);
  setTimeout(function () { deadlineDecide(c.id); }, 700);
}

/* ------------------------------- start ---------------------------------- */
function bootUI(had) {
  applyTheme();
  if (!location.hash) location.hash = '#/dashboard';
  logReset(today());
  route();
  pomoBoot();
  if (!had || !DB.onboarded) onboarding();
  else deadlineCheck();
}

(function boot() {
  var repoRec = storeRepoRecord();
  var localRec = null;
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (raw) localRec = JSON.parse(raw);
  } catch (e) { localRec = null; }

  var pickd = storeChoose(repoRec, localRec);
  var had = !!pickd.rec;

  if (had) {
    DB = Object.assign(blankDB(), pickd.rec);
    DB.profile = Object.assign(blankDB().profile, pickd.rec.profile || {});
    DB.pomoCfg = Object.assign(blankDB().pomoCfg, pickd.rec.pomoCfg || {});
    ['courses', 'sessions', 'resources', 'notebooks'].forEach(function (k) {
      if (!Array.isArray(DB[k])) DB[k] = [];
    });
    /* v1 → v2: re-ink colours saved under the old palette */
    if (!pickd.rec.v || pickd.rec.v < 2) {
      DB.courses.forEach(function (c, i) {
        if (PALETTE.indexOf(c.color) < 0) c.color = PALETTE[i % PALETTE.length];
      });
      DB.v = SCHEMA;
    }
    STORE.fromRepo = pickd.source === 'repo';
    storeMarkSeen(storeSummary(repoRec).savedAt);    // this file version is now accounted for
    /* the file won, but the browser had work of its own: keep it recoverable */
    if (pickd.source === 'repo' && localRec) {
      if (!storeSummary(localRec).empty && storeSig(localRec) !== storeSig(repoRec)) storeStash(localRec);
    }
    /* booted from the browser copy while the file is behind: it needs saving */
    if (pickd.source === 'browser' && repoRec) STORE.dirty = true;
    if (pickd.source === 'browser' && !repoRec) STORE.dirty = true;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ }
  }

  bootUI(had);
  storeReattach();                     // reattach the data file, if we may
  storeRefreshLine();

  if (had && pickd.source === 'repo' && localRec) {
    var stashed = storeStashed();
    if (stashed) {
      toast('Loaded the repo data file — the copy this browser had is kept, see Data', 8000,
            'Open Data', function () { location.hash = '#/data'; route(); });
    } else {
      toast('Loaded the data file from the repo (' + storeSummary(repoRec).sessions + ' sessions)');
    }
  }
})();
</script>
</body>
</html>
